const DEMO_KEY='prototype0000demo0000apikey000000';
const nzbLink=r=>location.origin+'/api/v1/api?t=get&id='+encodeURIComponent(r.guid)+'&apikey='+DEMO_KEY;
function copyText(t){window.__copied=t;if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(t).then(()=>true,()=>legacyCopy(t));return Promise.resolve(legacyCopy(t));}
function legacyCopy(t){const a=document.createElement('textarea');a.value=t;a.setAttribute('readonly','');a.style.cssText='position:fixed;top:0;left:0;opacity:0';document.body.appendChild(a);a.select();let ok=false;try{ok=document.execCommand('copy');}catch(e){}a.remove();return ok;}
const sectionCount=root=>{const c=D.counts[root]||[0,0,0];return c[1]?`${num(c[1])} added in the last 24 hours`:c[2]?`${num(c[2])} in the last 7 days, none today`:'nothing new this week';};
const shortCount=root=>{const c=D.counts[root]||[0,0,0];return c[1]?`${num(c[1])} today`:c[2]?`${num(c[2])} this week`:'none this week';};
// the followed titles: 'show:ID' / 'film:ID' (INVENTED set, hm/invented.json), with the newest releases of each (real)
const titleOf=key=>{const [k,id]=key.split(':');const e=k==='show'?D.shows[id]:D.films[id];return e?{kind:k,id:+id,t:e.t,y:e.y,net:e.net||'',p:e.p,art:e.p?`${DIR}art/${k==='show'?'tv':'mv'}/${id}.webp`:'',path:k==='show'?`/tv/show/${id}`:`/movies/film/${id}`}:null;};
const followedRel=key=>(D.followedRel[key]||[]).map(R);
const followed=()=>[...state.follow].map(k=>({key:k,...titleOf(k),rel:followedRel(k)})).filter(f=>f.t).map(f=>({...f,newest:f.rel[0]||null,newN:f.rel.filter(r=>r.added>LAST_VISIT).length})).sort((a,b)=>(b.newest?b.newest.added:0)-(a.newest?a.newest.added:0));
const releasesOfTitle=(kind,id)=>{const seen=new Set(),out=[];const add=r=>{if(r&&!seen.has(r.id)){seen.add(r.id);out.push(r);}};(D.followedRel[kind+':'+id]||[]).map(R).forEach(add);Object.values(REL).flat().forEach(r=>{const e=E(r);if(e&&e[0]===kind&&e[3]===id)add(r);});return out.sort((a,b)=>b.added-a.added||b.id-a.id);};

/* ---------- shared pieces: the approved row, the tile, chips ---------- */
function chips(r){const pc=Math.floor(r.comp);
  return (pc>=100||pc<=0?'':`<span class="rc comp ${pc>=95?'c-ok':pc>=75?'c-mid':'c-low'}" title="${pc}% of this release's articles were seen by the indexer.">${pc}% complete</span>`)
   +(r.pw?`<span class="rc">${ic('lock')}Password</span>`:'')
   +(r.nfo?`<button class="rc k-nfo" data-applink="/details/${r.guid}#nfo" title="View NFO">NFO</button>`:'')
   +(r.pv?`<button class="rc k-pv" data-applink="/details/${r.guid}#preview" title="View preview image">Preview</button>`:'');}
function rowOrigin(r){const link=(href,t,icon,label,cut)=>`<a class="rc origin" href="#" data-applink="${href}" title="${esc(t)}">${ic(icon)}${cut?`<span class="ot">${esc(label)}</span>`:esc(label)}</a>`;
  return `<span class="orig">`+(r.group?link('/browse/all?group='+encodeURIComponent(r.group),'All releases in '+r.group,'users',r.group.replace('alt.binaries.','a.b.')):'')
   +(r.poster?link('/browse/all?poster='+encodeURIComponent(r.poster),'All posts by '+r.poster,'user',r.poster,true):'')+`</span>`;}
function entLine(r){const e=E(r);if(!e)return '';
  if(e[0]==='film')return `<a class="showlink" href="#" data-applink="/movies/film/${e[3]}" title="Go to the film">${esc(e[1])}${e[2]?' · '+esc(e[2]):''}</a>`;
  if(e[0]==='show')return `<a class="showlink" href="#" data-applink="/tv/show/${e[3]}" title="Go to the show">${esc(e[1])}${e[2]?' · '+esc(e[2]):''}${e[4]?' · '+esc(e[4]):''}</a>`;
  return `<span class="gameline">${esc([e[1],e[2]].filter(Boolean).join(' · '))}</span>`;}
const fic=()=>ic('bookmark').replace('class="i"','class="i fill"');
const followKey=r=>{const e=E(r);return e&&(e[0]==='film'||e[0]==='show')?e[0]+':'+e[3]:null;};
// 2 x 2: Download + Copy link on top, Cart + Follow below; Follow only when the release is matched to a film or show (the Movies / TV rule)
function rowActions(r){const inC=state.cart.has(r.id),fk=followKey(r),w=fk&&state.follow.has(fk),what=fk?fk.split(':')[0]:'';
  return `<div class="iconacts stack"><button class="ia dl" data-nzb="${r.id}" title="Download NZB" aria-label="Download NZB">${ic('down')}</button><button class="ia" data-copynzb="${r.id}" title="Copy NZB link for SABnzbd or NZBGet" aria-label="Copy NZB link for SABnzbd or NZBGet">${ic('link')}</button><button class="ia" data-cart="${r.id}" aria-pressed="${inC}" title="${inC?'In cart · click to remove':'Add to cart'}" aria-label="${inC?'Remove from cart':'Add to cart'}">${ic('cart')}</button>${fk?`<button class="ia" data-watch="${fk}" aria-pressed="${!!w}" title="${w?'Following this '+what+' · click to unfollow':'Follow this '+what}" aria-label="${w?'Unfollow '+what:'Follow '+what}">${fic()}</button>`:'<span class="ia slot" aria-hidden="true"></span>'}</div>`;}
const catLabel=(r,root)=>root&&root!=='All'?r.sub:r.root+' > '+r.sub;
// the generic list's row (releases.html): name, entity line, chips, "Root > Sub" (the sub alone inside one section), size, added, 2 x 2 buttons
function rowsTable(rows,{root=null,dateLabel='Added',dayrow=null}={}){
  if(!rows.length)return '';
  const catW=root&&root!=='All'?110:190;
  let h=`<table class="feed hm"><colgroup><col><col style="width:${catW}px"><col style="width:82px"><col style="width:112px"><col style="width:96px"></colgroup><thead><tr><th>Release</th><th>Category</th><th class="num">Size</th><th class="num">${dateLabel}</th><th><span class="vh">Actions</span></th></tr></thead><tbody>`;
  rows.forEach((x,i)=>{if(dayrow&&dayrow.at===i)h+=dayrow.html;
    h+=`<tr><td class="what"><a class="rname" href="#" data-applink="/details/${x.guid}" title="${esc(x.name)}">${esc(x.name)}</a>${entLine(x)}<div class="rchips">${chips(x)}${rowOrigin(x)}</div></td>
    <td class="c-cat" title="${esc(x.root+' > '+x.sub)}">${esc(catLabel(x,root))}</td><td class="num c-size">${gb(x.size)}</td>
    <td class="num c-date" title="Posted ${fullDate(x.t)} · Added ${fullDate(x.added)}">${ago(x.added)}</td>
    <td class="c-acts">${rowActions(x)}</td></tr>`;});
  if(dayrow&&dayrow.at>=rows.length)h+=dayrow.html;
  return h+'</tbody></table>';}
// a compact row for narrow blocks: the name, one meta line, Download and Cart
// the meta line: the entity (if any), then the category (the sub alone inside one section, "Root > Sub" in a mixed block), size, age
function crow(r,{meta=null,cart=true,root=null}={}){const inC=state.cart.has(r.id);const e=E(r);
  const entity=e?(e[0]==='album'?[e[1],e[2]].filter(Boolean).join(' · '):e[1]+(e[2]?' · '+e[2]:'')):'';
  const m=meta!=null?meta:[entity,catLabel(r,root),gb(r.size),ago(r.added)].filter(Boolean).join(' · ');
  return `<div class="crow"><div class="txt"><a class="nm" href="#" data-applink="/details/${r.guid}" title="${esc(r.name)}">${esc(r.name)}</a><span class="meta" title="Posted ${fullDate(r.t)} · Added ${fullDate(r.added)}">${esc(m)}</span></div><div class="iconacts stack"><button class="ia dl" data-nzb="${r.id}" title="Download NZB" aria-label="Download NZB">${ic('down')}</button>${cart?`<button class="ia" data-cart="${r.id}" aria-pressed="${inC}" title="${inC?'In cart · click to remove':'Add to cart'}" aria-label="${inC?'Remove from cart':'Add to cart'}">${ic('cart')}</button>`:''}</div></div>`;}
// a poster tile (the TV / Movies prototypes' tile): artwork 2:3, title under it, one meta line; a "N new" badge in the corner when asked
function tile(f,{badge='',what='',button=false,expanded=null,cls=''}={}){const art=f.art?`<img src="${f.art}" alt="" loading="lazy">`:`<div class="ph">${ic(f.kind==='show'?'tv':'film')}<span class="t">${esc(f.t)}</span></div>`;
  const inner=`<div class="art">${art}${badge?`<span class="count">${esc(badge)}</span>`:''}</div><b>${esc(f.t)}</b>${what?`<div class="what ago">${esc(what)}</div>`:''}`;
  return button?`<button class="tile ${cls}" data-tile="${f.kind}:${f.id}" aria-expanded="${expanded===f.kind+':'+f.id}" title="${esc(f.t)}">${inner}</button>`:`<a class="tile ${cls}" href="#" data-applink="${f.path}" title="${esc(f.t)}">${inner}</a>`;}
const secHead=(title,cnt,see)=>`<div class="sech"><h2>${title}</h2>${cnt?`<span class="cnt">${cnt}</span>`:''}<span class="grow"></span>${see||''}</div>`;
const seeAll=(label,path)=>`<a class="see" href="#" data-applink="${path}">${label}${ic('open')}</a>`;
const pageHead=(controls)=>`<div class="filters home"><h1>Home</h1><span class="grow"></span>${controls}</div>`;
// window.ONLY (set by build-home.py for the public copy) pins the page to the approved mockup and drops the selector bar
const protoBar=()=>window.ONLY?'':`<div class="proto" role="group" aria-label="Mockup selector"><span>Four home-page mockups on the same data. Pick one:</span><div class="seg">${MOCKUPS.map(([n,l])=>`<button data-m="${n}" aria-pressed="${state.m===n}"><b>${n}</b>${l}</button>`).join('')}</div></div>`;
function renderNav(){$('#navlinks').innerHTML=NAV.map(([l,p])=>`<a class="l" href="#" data-applink="${p}">${l}</a>`).join('');
  $('#scope').innerHTML=['All',...NAV.slice(0,8).map(n=>n[0])].map(l=>`<option>${l}</option>`).join('');$('#cartn').textContent=state.cart.size;}
// the last-visit line: the label on a rule through the list; everything above it arrived since the last visit
const lastVisitRow=(at)=>({at,html:`<tr class="dayrow visit"><td colspan="5"><span class="vline"><b>You were last here ${esc(dayTime(LAST_VISIT))}</b><span>· everything above arrived since</span></span></td></tr>`});
const emptyFollow=()=>`<div class="empty inline"><b>Nothing followed yet.</b>Follow a show or a film from its page, or with the bookmark button on any release row, and its newest releases will be waiting here.<br><a href="#" data-applink="/tv/shows">Browse shows</a> · <a href="#" data-applink="/movies/films">Browse films</a></div>`;

/* ---------- idea 1: Following first ---------- */
const M1_DEFAULT={follow:true,sections:['TV','Movies','Audio'],rows:5};
function m1(){if(!state.m1){try{state.m1={...M1_DEFAULT,...JSON.parse(store.get('m1','{}'))};}catch(e){state.m1={...M1_DEFAULT};}}return state.m1;}
function viewM1(){const s=m1();let h=pageHead(`<button class="btn sec tool" data-cust="m1">${ic('sliders')}Customize</button>`);
  if(s.follow){const fl=followed(),withNew=fl.filter(f=>f.newN>0);
    h+=`<section class="hsec" data-sec="following">${secHead('Following',fl.length?(withNew.length?`${withNew.length} of ${fl.length} with something new since your last visit`:`${fl.length} followed · nothing new since your last visit`):'',seeAll('Manage Following','/watchlist'))}`;
    if(!fl.length)h+=emptyFollow();
    else{// the titles with something new lead; the rest are one line, not a wall of posters
      const strip=withNew.length?withNew:fl.slice(0,8),rest=fl.length-strip.length;
      h+=`<div class="tiles strip">${strip.map(f=>tile(f,{badge:f.newN?f.newN+' new':'',what:f.newest?ago(f.newest.added):'no releases yet'})).join('')}</div>`;
      if(rest>0)h+=`<p class="tiles-rest">${withNew.length?`${rest} more followed title${rest===1?' has':'s have'} nothing new since your last visit.`:`${rest} more followed title${rest===1?'':'s'}.`} <a href="#" data-applink="/watchlist">See all of them</a></p>`;
      // the newest releases of the followed titles: everything since the last visit, the hairline, then the newest older one per title
      // one row per followed title (its newest release): the new ones above the line, then the newest older ones
      const fresh=withNew.map(f=>f.newest).sort((a,b)=>b.added-a.added||b.id-a.id);
      const older=fl.filter(f=>!f.newN&&f.newest).map(f=>f.newest).sort((a,b)=>b.added-a.added||b.id-a.id).slice(0,4);
      h+=rowsTable([...fresh,...older],{dayrow:lastVisitRow(fresh.length)});}
    h+='</section>';}
  s.sections.forEach(root=>{const rows=(REL[root]||[]).slice(0,s.rows);
    h+=`<section class="hsec" data-sec="${root}">${secHead('Newest in '+root,sectionCount(root),seeAll('All '+root+' releases',SECTION_PATH[root]))}${rows.length?rowsTable(rows,{root}):`<p class="empty inline">No ${root} releases in the catalogue yet.</p>`}</section>`;});
  if(!s.follow&&!s.sections.length)h+=`<div class="empty inline"><b>Nothing on the home page.</b>Use Customize to choose what it shows.</div>`;
  return h;}
// a customize row: a checkbox button (box + label) beside the move buttons, never a checkbox that contains buttons
const chk=(attrs,on,label,sub)=>`<button class="chk" role="checkbox" aria-checked="${on}" ${attrs}><span class="box">${on?ic('check'):''}</span><span class="lbl">${label}${sub?`<small>${sub}</small>`:''}</span></button>`;
// reordering is drag and drop (a grip on every row; keyboard: Space grabs, arrow keys move, Space drops), never arrow buttons
const grip=label=>`<span class="grip" data-grip tabindex="0" role="button" aria-pressed="false" aria-label="Drag to reorder ${esc(label)}" title="Drag to reorder">${ic('grip')}</span>`;
function custM1(){const s=m1();const row=root=>`<div class="row" data-key="${root}">${chk(`data-m1sec="${root}"`,s.sections.includes(root),'Newest in '+root,sectionCount(root))}${grip('Newest in '+root)}</div>`;
  const ordered=[...s.sections,...D.roots.filter(r=>!s.sections.includes(r))];
  return `<div class="row">${chk('data-m1follow',s.follow,'Following','Your followed shows and films, newest release first')}</div>
   <div class="grp" data-dragzone="m1"><h3>Sections, in the order they appear · drag to reorder</h3>${ordered.map(row).join('')}</div>
   <div class="grp"><h3>Rows per section</h3><div class="opts"><div class="seg">${[5,10].map(n=>`<button data-m1rows="${n}" aria-pressed="${s.rows===n}">${n}</button>`).join('')}</div></div></div>`;}

/* ---------- idea 2: Shelves ---------- */
const M2_DEFAULT={order:['Following','TV','Movies','Audio','Books','Console','PC','Adult','Other'],on:['Following','TV','Movies','Audio','Books']};
function m2(){if(!state.m2){try{state.m2={...M2_DEFAULT,...JSON.parse(store.get('m2','{}'))};}catch(e){state.m2={...M2_DEFAULT};}}return state.m2;}
const shelfSub={Following:'Your followed shows and films, the newest release first',TV:'Shows with new episodes in the last 24 hours',Movies:'Films posted in the last 7 days',Audio:'The newest albums',Books:'The newest releases',Console:'The newest releases',PC:'The newest releases',Adult:'The newest releases, with their preview pictures',Other:'The newest releases (Misc and Hashed)'};
// what sits on a shelf: titles (shows with new episodes, films this week), albums, or release cards
function shelfItems(root){
  if(root==='Following')return followed().map(f=>({kind:f.kind,id:f.id,t:f.t,art:f.art,what:f.newest?ago(f.newest.added):'no releases yet',badge:f.newN?f.newN+' new':'',dim:!f.newN}));
  if(root==='TV')return D.newEpisodes24.map(([vi,n,p])=>{const f=titleOf('show:'+vi);return f&&{kind:'show',id:vi,t:f.t,art:f.art,what:(n===1?'1 episode':n+' episodes')+' today',badge:''};}).filter(Boolean);
  if(root==='Movies')return D.newFilms7.map(([mi,p,n])=>{const f=titleOf('film:'+mi);return f&&{kind:'film',id:mi,t:f.t+(f.y?' ('+f.y+')':''),art:f.art,what:n===1?'1 release · '+ago(p):n+' releases · '+ago(p),badge:''};}).filter(Boolean);
  if(root==='Audio'){const seen=new Set(),out=[];(REL.Audio||[]).forEach(r=>{const e=E(r);const key=e?[e[1],e[2]].join('|'):'rel:'+r.id;if(seen.has(key))return;seen.add(key);out.push({kind:'album',id:r.id,t:e?e[2]||e[1]:r.name,sub:e?e[1]:'',art:'',what:ago(r.added),badge:'',r});});return out;}
  // the Adult shelf shows the preview picture (16:9, the Adult list's tile) when the release has one (his rule 2026-10-10)
  if(root==='Adult')return (REL.Adult||[]).map(r=>({kind:'pic',id:r.id,t:r.name,art:r.pv?`${DIR}art/pv/${r.guid}.webp`:'',what:ago(r.added),badge:'',r}));
  return (REL[root]||[]).map(r=>({kind:'rel',id:r.id,t:r.name,art:'',what:ago(r.added),badge:'',r}));}
function shelfTile(it,open){const key=it.kind+':'+it.id;
  if(it.kind==='album')return `<button class="tile sq" data-tile="${key}" aria-expanded="${open===key}" title="${esc(it.t)}"><div class="art"><div class="ph">${ic('disc')}${it.sub?`<span class="t">${esc(it.sub)}</span>`:''}</div></div><b>${esc(it.t)}</b><div class="what ago">${esc(it.what)}</div></button>`;
  if(it.kind==='pic')return `<button class="tile pic" data-tile="${key}" aria-expanded="${open===key}" title="${esc(it.t)}"><div class="art">${it.art?`<img src="${it.art}" alt="" loading="lazy">`:`<div class="ph nopic">${ic('image')}<small>No picture</small></div>`}</div><b>${esc(it.t)}</b><div class="what ago">${esc(it.r.sub)} · ${gb(it.r.size)} · ${esc(it.what)}</div></button>`;
  if(it.kind==='rel')return `<button class="tile rcard" data-tile="${key}" aria-expanded="${open===key}" title="${esc(it.t)}"><div class="art"><div class="ph"><span class="t">${esc(it.t)}</span><span class="rc">${esc(it.r.sub)}</span></div></div><div class="what ago">${gb(it.r.size)} · ${esc(it.what)}</div></button>`;
  return tile({kind:it.kind,id:it.id,t:it.t,art:it.art},{badge:it.badge,what:it.what,button:true,expanded:open,cls:it.dim?'dimmed':''});}
function shelfPanel(root,open){if(!open)return '';const [kind,id]=open.split(':');let title,cnt,rows,path='';
  if(kind==='album'||kind==='rel'||kind==='pic'){const r=BYID[+id];if(!r)return '';rows=[r];title=kind==='album'&&E(r)?[E(r)[1],E(r)[2]].filter(Boolean).join(' · '):r.name;cnt='';}
  else{const f=titleOf(open);if(!f)return '';rows=releasesOfTitle(kind,+id);title=f.t;cnt=rows.length===1?'newest release':`${rows.length} newest releases`;path=f.path;}
  return `<div class="shelfpanel" data-panel="${esc(open)}"><div class="sph"><h3>${esc(title)}</h3>${cnt?`<span class="cnt">${cnt}</span>`:''}<button class="ia" data-closepanel aria-label="Close">${ic('x')}</button></div>${rowsTable(rows,{root:root==='Following'?null:root})}${path?`<div class="after"><a class="btn sec" href="#" data-applink="${path}">${kind==='show'?'All episodes and seasons':'All releases of this film'}${ic('open')}</a></div>`:''}</div>`;}
function viewM2(){const s=m2();let h=pageHead(`<button class="btn sec tool" data-cust="m2">${ic('sliders')}Shelves</button>`);
  const shelves=s.order.filter(r=>s.on.includes(r));
  shelves.forEach(root=>{const items=shelfItems(root),open=state.open&&state.open.startsWith(root+'|')?state.open.slice(root.length+1):null;
    const cnt=root==='Following'?(items.length?`${items.filter(i=>i.badge).length} of ${items.length} with something new`:''):root==='TV'?`${shortCount('TV')} · ${items.length} shows with new episodes`:root==='Movies'?`${shortCount('Movies')} · ${items.length} films this week`:shortCount(root);
    h+=`<section class="hsec shelf" data-shelf="${root}">${secHead(root,cnt,`<div class="railnav"><button class="ia" data-rail="${root}:-1" aria-label="Scroll ${root} left">${ic('back')}</button><button class="ia" data-rail="${root}:1" aria-label="Scroll ${root} right">${ic('open')}</button></div>${seeAll(root==='Following'?'Manage Following':'All '+root,root==='Following'?'/watchlist':SECTION_PATH[root])}`)}`;
    if(!items.length)h+=root==='Following'?emptyFollow():`<p class="empty inline">Nothing in ${root} in the last days.</p>`;
    else h+=`<div class="rail" data-railof="${root}" aria-label="${shelfSub[root]}">${items.map(it=>shelfTile(it,open)).join('')}</div>${shelfPanel(root,open)}`;
    h+='</section>';});
  if(!shelves.length)h+=`<div class="empty inline"><b>No shelves.</b>Use Shelves to choose which sections appear.</div>`;
  return h;}
function custM2(){const s=m2();return `<div class="grp" style="border:0;padding:0;margin:0" data-dragzone="m2"><h3>Shelves, in the order they appear · drag to reorder</h3>${s.order.map(root=>`<div class="row" data-key="${root}">${chk(`data-m2on="${root}"`,s.on.includes(root),root,shelfSub[root])}${grip(root)}</div>`).join('')}</div>`;}

/* ---------- idea 3: Saved views ---------- */
const BUILTIN_VIEWS=[{id:'new',name:'New today',root:'All',excludeOther:true},{id:'following',name:'Following',root:'Following'}];
const M3_DEFAULT={views:[...BUILTIN_VIEWS,...[]],def:'new',active:null};
function m3(){if(!state.m3){let saved=null;try{saved=JSON.parse(store.get('m3','null'));}catch(e){}
    state.m3=saved||{views:[...BUILTIN_VIEWS,...INV.savedViews.map(v=>({id:v.id,name:v.name,root:v.root,sub:v.sub||[],q:v.id==='tv1080'?'1080p web':v.id==='uhd'?'2160p':''}))],def:'tv1080',active:null};
    if(!state.m3.active)state.m3.active=state.m3.def;}return state.m3;}
const viewById=id=>m3().views.find(v=>v.id===id);
// the rows of a view: the newest releases of its section that carry every word of its name filter and one of its sub-categories
function viewRows(v){if(v.root==='Following')return followed().flatMap(f=>f.rel).sort((a,b)=>b.added-a.added||b.id-a.id).slice(0,25);
  let rows=v.root==='All'?Object.values(REL).flat().sort((a,b)=>b.added-a.added||b.id-a.id):(REL[v.root]||[]);
  if(v.excludeOther)rows=rows.filter(r=>r.root!=='Other');
  if(v.sub&&v.sub.length)rows=rows.filter(r=>v.sub.includes(r.sub));
  if(v.q){const words=v.q.toLowerCase().split(/\s+/).filter(Boolean);rows=rows.filter(r=>words.every(w=>r.name.toLowerCase().includes(w)));}
  return rows.slice(0,25);}
const viewCells=v=>{const cells=[['Section',v.root==='All'?'All sections':v.root==='Following'?'Followed titles':v.root]];if(v.excludeOther)cells.push(['Category','Exclude Other']);if(v.sub&&v.sub.length)cells.push(['Category',v.sub.length>2?v.sub.length+' chosen':v.sub.join(', ')]);if(v.q)cells.push(['Name contains',v.q]);return cells;};

  return ['','',''];}

<script>

function rerender(){render();refreshDialog();}

const mv=(arr,key,dir,of=x=>x)=>{const i=arr.findIndex(x=>of(x)===key),j=i+dir;if(i<0||j<0||j>=arr.length)return false;[arr[i],arr[j]]=[arr[j],arr[i]];return true;};

document.addEventListener('click',e=>{

  if(t.dataset.tile){const shelf=t.closest('[data-shelf]');const key=shelf?shelf.dataset.shelf+'|'+t.dataset.tile:null;state.open=state.open===key?null:key;render();
    if(state.open){const p=$('.shelfpanel');p&&p.scrollIntoView({block:'nearest',behavior:'smooth'});}return;}

  // idea 4
  if(t.hasAttribute('data-editblk')){const s=m4();s.edit=!s.edit;state.dd=null;render();return;}
  if(t.hasAttribute('data-resetblk')){state.m4={...M4_DEFAULT,blocks:M4_DEFAULT.blocks.map(b=>({...b})),edit:true};saveM4();render();toast('Layout reset');return;}

});
document.addEventListener('click',e=>{if(state.dd&&!e.target.closest('.msel')){state.dd=null;render();}},true);

document.addEventListener('input',e=>{if(e.target.dataset.vname){const v=viewById(e.target.dataset.vname);if(v){v.name=e.target.value.trim()||v.name;saveM3();const tab=$(`.vtabs [data-view="${v.id}"]`);if(tab)tab.firstChild.textContent=v.name;}}});
document.addEventListener('change',e=>{if(e.target.id==='vf-root'){const subs=$('#modal [data-subs]');if(subs)subs.innerHTML=subsOf(e.target.value).map(sb=>`<button type="button" class="pill" data-vsub="${esc(sb)}" aria-pressed="false">${esc(sb)}</button>`).join('');}});
document.addEventListener('submit',e=>{const f=e.target.closest('[data-viewform]');if(!f)return;e.preventDefault();
  const s=m3(),name=f.name.value.trim(),root=f.root.value,sub=$$('[data-vsub][aria-pressed=true]',f).map(b=>b.dataset.vsub),q=f.q.value.trim();if(!name)return;
  let v=f.dataset.vid?viewById(f.dataset.vid):null;
  if(v){Object.assign(v,{name,root,sub,q});toast('View saved');}
  else{v={id:'v'+Date.now().toString(36),name,root,sub,q};s.views.push(v);toast('View added');}
  s.active=v.id;saveM3();closeDialog();render();});

/* ---------- drag and drop reordering (his rule 2026-10-10: never arrow buttons) ----------
   A grip on every reorderable row or block. Pointer: lift a ghost, the list reflows live under the pointer, drop commits.
   Keyboard on the grip: Space grabs, arrow keys move, Space drops, Escape puts it back. One commit handler per zone. */
const ZONES={
  m1:keys=>{const s=m1();s.sections=keys.filter(k=>s.sections.includes(k));saveM1();rerender();},
  m2:keys=>{m2().order=keys;saveM2();rerender();},
  m3:keys=>{const s=m3();s.views=keys.map(id=>s.views.find(v=>v.id===id)).filter(Boolean);saveM3();rerender();},
  m4:keys=>{const s=m4();s.blocks=keys.map(i=>s.blocks[+i]).filter(Boolean);saveM4();render();}};
const zoneItems=zone=>[...zone.querySelectorAll('[data-key]')].filter(x=>x.closest('[data-dragzone]')===zone);
const zoneKeys=zone=>zoneItems(zone).map(x=>x.dataset.key);
function commitZone(zone,start){const keys=zoneKeys(zone);if(keys.join()!==start.join()){ZONES[zone.dataset.dragzone](keys);toast('Order saved');}}
let drag=null;
document.addEventListener('pointerdown',e=>{const g=e.target.closest('[data-grip]');if(!g||e.button!==0)return;const item=g.closest('[data-key]'),zone=item&&item.closest('[data-dragzone]');if(!zone)return;e.preventDefault();
  // the ghost is the row's clone inside a carrier that wears the ancestors' classes, so the dialog-scoped row styles still apply to it
  const r=item.getBoundingClientRect(),clone=item.cloneNode(true),ghost=document.createElement('div');clone.removeAttribute('data-key');clone.classList.remove('dragging');
  ghost.className='ghost '+(zone.classList.contains('board')?'board edit':'cust');ghost.appendChild(clone);ghost.style.cssText=`width:${r.width}px;height:${r.height}px;left:${r.left}px;top:${r.top}px`;document.body.appendChild(ghost);
  item.classList.add('dragging');drag={item,zone,ghost,dx:e.clientX-r.left,dy:e.clientY-r.top,start:zoneKeys(zone)};try{g.setPointerCapture(e.pointerId);}catch(err){}});
document.addEventListener('pointermove',e=>{if(!drag)return;drag.ghost.style.left=(e.clientX-drag.dx)+'px';drag.ghost.style.top=(e.clientY-drag.dy)+'px';
  const grid=drag.zone.classList.contains('board'),items=zoneItems(drag.zone).filter(x=>x!==drag.item);let target=null,before=false;
  for(const x of items){const b=x.getBoundingClientRect();if(e.clientX>=b.left&&e.clientX<=b.right&&e.clientY>=b.top&&e.clientY<=b.bottom){target=x;before=grid?e.clientX<b.left+b.width/2:e.clientY<b.top+b.height/2;break;}}
  if(!target&&!grid){let bd=1e9;for(const x of items){const b=x.getBoundingClientRect(),d=Math.abs(e.clientY-(b.top+b.height/2));if(d<bd){bd=d;target=x;before=e.clientY<b.top+b.height/2;}}}
  if(target&&target!==drag.item){if(before)target.before(drag.item);else target.after(drag.item);}});
const endDrag=e=>{if(!drag)return;const d=drag;drag=null;d.ghost.remove();d.item.classList.remove('dragging');commitZone(d.zone,d.start);};
document.addEventListener('pointerup',endDrag);document.addEventListener('pointercancel',endDrag);
document.addEventListener('keydown',e=>{const g=e.target.closest&&e.target.closest('[data-grip]');if(!g)return;const item=g.closest('[data-key]'),zone=item&&item.closest('[data-dragzone]');if(!zone)return;
  const grabbed=g.getAttribute('aria-pressed')==='true';
  if(e.key===' '||e.key==='Enter'){e.preventDefault();if(!grabbed){g.setAttribute('aria-pressed','true');item.classList.add('grabbed');g.dataset.start=zoneKeys(zone).join();toast('Grabbed · arrow keys move it, Space drops it');}
    else{g.setAttribute('aria-pressed','false');item.classList.remove('grabbed');const start=(g.dataset.start||'').split(',');commitZone(zone,start);}return;}
  if(!grabbed)return;
  if(e.key==='Escape'){e.preventDefault();const start=(g.dataset.start||'').split(',');const byKey=Object.fromEntries(zoneItems(zone).map(x=>[x.dataset.key,x]));start.forEach(k=>byKey[k]&&zone.appendChild(byKey[k]));g.setAttribute('aria-pressed','false');item.classList.remove('grabbed');g.focus();return;}
  const announce=()=>{const items=zoneItems(zone);toast(`${g.getAttribute('aria-label').replace(/^Drag to reorder /,'')} · position ${items.indexOf(item)+1} of ${items.length}`);};
  if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();const p=item.previousElementSibling;if(p&&p.hasAttribute('data-key'))p.before(item);g.focus();announce();}
  if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();const n=item.nextElementSibling;if(n&&n.hasAttribute('data-key'))n.after(item);g.focus();announce();}});

/* ---------- boot ---------- */
(async()=>{
  document.documentElement.dataset.theme=store.get('theme','dark');
  const [d,inv]=await Promise.all([fetch(DIR+'data.json'+NOCACHE).then(r=>r.json()),fetch(DIR+'invented.json'+NOCACHE).then(r=>r.json())]);
  D=d;INV=inv;NOW=D.now;LAST_VISIT=NOW-72*3600;CONTENT=INV.content||[];
  Object.entries(D.rel).forEach(([root,rows])=>{REL[root]=rows.map(R);REL[root].forEach(r=>BYID[r.id]=r);});
  Object.values(D.followedRel).forEach(rows=>rows.forEach(a=>{const r=R(a);if(!BYID[r.id])BYID[r.id]=r;}));
  Object.entries(D.ent).forEach(([id,e])=>ENT[+id]=e);
  try{state.cart=new Set(JSON.parse(store.get('cart','null'))||INV.basket);}catch(e){state.cart=new Set(INV.basket);}
  try{const f=JSON.parse(store.get('follow','null'));state.follow=new Set(f||[...INV.followShows.map(i=>'show:'+i),...INV.followFilms.map(i=>'film:'+i)]);}catch(e){state.follow=new Set([...INV.followShows.map(i=>'show:'+i),...INV.followFilms.map(i=>'film:'+i)]);}
  renderNav();
  document.fonts.ready.then(()=>{route();window.READY=true;});
})();
