const hdrChips=h=>{if(!h)return '';const o=[];if(/Dolby Vision/.test(h)){const p=h.match(/Profile ([\d.]+)/);o.push(`<span class="hue k-dv">Dolby Vision${p?' · profile '+p[1]:''}</span>`);}if(/HDR10\+/.test(h))o.push('<span class="hue k-hdrp">HDR10+</span>');else if(/HDR10/.test(h))o.push('<span class="hue k-hdr">HDR10</span>');return o.join('');};
const chanChip=t=>{const c=chan(t);return c?`<span class="hue ${{'7.1':'k-71','5.1':'k-51','Stereo':'k-20'}[c]||'grey'}">${c}</span>`:'';};
function mi2(m,relRes,tag){const col=true,resName=(w,h)=>RES.includes(relRes)?relRes:resByPx(w,h);
  const v=m.v[0]||{},aL=uniq(m.a.map(t=>lang(t.lang))),sL=uniq(m.s.map(t=>lang(t.lang)));
  const bestA=[...m.a].sort((x,y)=>(+(y.ch||y.chs||0))-(+(x.ch||x.chs||0)))[0];
  const glance=[
    ['Video',v.w?`${resName(v.w,v.h)} · ${VC[v.fmt]||v.fmt}`:'None',[v.w&&v.h?v.w+' × '+v.h:'',hdrShort(v.hdr),v.bd?v.bd+'-bit':''].filter(Boolean).join(' · ')],
    ['Audio',m.a.length?(aL.length?few(aL):m.a.length+' track'+(m.a.length===1?'':'s')):'None',bestA?[ACs[bestA.fmt]||bestA.fmt,chan(bestA)].filter(Boolean).join(' ')+(m.a.length>1?' · '+m.a.length+' tracks':''):''],
    ['Subtitles',m.s.length?(sL.length===1?sL[0]:sL.length+' languages'):'None',m.s.length&&sL.length>1?few(sL):m.s.length>1?m.s.length+' tracks':''],
    ['File',[m.cf,miDur(m.dur,m.durs)].filter(Boolean).join(' · ')||'Unknown',m.obrs?obrs(m.obrs)+' overall':'']];
  const secChip=(k,n)=>col?`<span class="hue ${{Video:'hv',Audio:'ha',Subtitles:'hs'}[k]||'grey'}">${k}</span>`:k;
  if(col&&v.w){glance[0][3]=`<span class="res ${RESC[resName(v.w,v.h)]}">${resName(v.w,v.h)}</span>${esc(VC[v.fmt]||v.fmt)}${hdrChips(v.hdr)}`;glance[0][2]=[v.w+' × '+v.h,v.bd?v.bd+'-bit':''].filter(Boolean).join(' · ');}
  if(col&&bestA){glance[1][3]=`${esc(glance[1][1])}${chanChip(bestA)}${m.a.some(x=>/JOC/.test(x.fmt||''))?'<span class="hue k-atmos">Atmos</span>':''}`;glance[1][2]=(ACs[bestA.fmt]||bestA.fmt||'').replace(' Atmos','')+(m.a.length>1?' · '+m.a.length+' tracks':'');}
  let h=`<div class="mi2 ${col?'col':''}"><dl class="glance">${glance.map(([k,a,b,rich])=>`<div><dt>${secChip(k)}</dt><dd>${rich||esc(a)}${b?`<small>${esc(b)}</small>`:''}</dd></div>`).join('')}</dl>`;
  // video: nearly always one stream, so a labelled grid (same component as the Overview facts)
  m.v.forEach((t,i)=>{const f=[['Codec',(VC[t.fmt]||t.fmt)+(VC[t.fmt]&&VC[t.fmt]!==t.fmt?' ('+t.fmt+')':'')],['Resolution',t.w&&t.h?t.w+' × '+t.h:null],['Aspect ratio',t.ar&&/^\d\.\d+$/.test(t.ar)?(+t.ar).toFixed(2)+':1':t.ar],['Frame rate',t.fr?(+t.fr).toFixed(3).replace(/\.?0+$/,'')+' fps':null],['HDR',hdr(t.hdr)],['Bit depth',t.bd?t.bd+'-bit':null],['Profile',t.prof],['Bit rate',miRate(t.br)],['Language',lang(t.lang)]].filter(([,x])=>x);
    const cell=(k,x)=>col&&k==='HDR'?`<span class="chips">${hdrChips(t.hdr)}</span>`:col&&k==='Resolution'?`<span class="chips">${esc(x)}<span class="res ${RESC[resName(t.w,t.h)]}">${resName(t.w,t.h)}</span></span>`:esc(x);
    h+=`<h3>${secChip('Video')}${m.v.length>1?' '+(i+1):''}</h3><dl class="vgrid hv">${f.map(([k,x])=>`<div><dt>${k}</dt><dd>${cell(k,x)}</dd></div>`).join('')}</dl>`;});
  if(m.a.length){const hasT=m.a.some(t=>t.title&&t.title!==lang(t.lang)),hasB=m.a.some(t=>miRate(t.br,t.brs));
    h+=`<h3>${secChip('Audio')}<small>${m.a.length} track${m.a.length===1?'':'s'}</small></h3><table class="ha"><thead><tr><th class="n">#</th><th style="width:24%">Title</th><th>Format</th><th style="width:14%">Channels</th>${hasB?'<th class="num" style="width:13%">Bit rate</th>':''}<th class="num" style="width:13%">Sample rate</th></tr></thead><tbody>${m.a.map((t,i)=>`<tr><td class="n">${i+1}</td><td class="lead">${esc(t.title||(m.a.length===1&&tag)||'—')}</td><td>${col&&/JOC/.test(t.fmt||'')?`<span class="chips">Dolby Digital Plus<span class="hue k-atmos">Atmos</span></span>`:esc(AC[t.fmt]||t.fmt||'')}<span class="sub">${esc(t.fmt||'')}</span></td><td>${col?chanChip(t):esc(chan(t)||'')}</td>${hasB?`<td class="num">${esc(miRate(t.br,t.brs)||'')}</td>`:''}<td class="num">${esc(t.sr?(t.sr/1000)+' kHz':(t.srs||'').replace('.0',''))}</td></tr>`).join('')}</tbody></table>`;}
  if(m.s.length){const bare=m.s.every(t=>Object.keys(t).length<=1);
    h+=`<h3>${secChip('Subtitles')}<small>${m.s.length} track${m.s.length===1?'':'s'}${sL.length>1?' · '+sL.length+' languages':''}</small></h3>`;
    if(bare){const c=new Map();m.s.forEach(t=>{const l=lang(t.lang)||'Not stated';c.set(l,(c.get(l)||0)+1);});
      h+=`<div class="langs hs">${[...c].sort((a,b)=>a[0].localeCompare(b[0])).map(([l,n])=>`<div>${esc(l)}${n>1?`<span>${n} tracks</span>`:''}</div>`).join('')}</div>`;}
    else h+=`<table class="hs"><thead><tr><th class="n">#</th><th style="width:24%">Language</th><th>Kind</th><th style="width:30%">Format</th></tr></thead><tbody>${m.s.map((t,i)=>{const ti=t.title&&t.title!==lang(t.lang)?t.title:'',sdh=/SDH|CC|hearing/i.test(ti),forced=t.f||/forced/i.test(ti),rest0=ti.replace(/[\[(]?\b(SDH|CC|Forced)\b[\])]?/ig,'').replace(/\s+/g,' ').trim(),rest=rest0===lang(t.lang)?'':rest0,sc=SC[t.fmt]||[t.fmt||'',''];
      return `<tr><td class="n">${i+1}</td><td class="lead">${esc(lang(t.lang)||'Not stated')}${rest?`<span class="sub">${esc(rest)}</span>`:''}</td><td><span class="chips">${t.d?`<span class="${col?'hue k-def':'flag'}">Default</span>`:''}${forced?`<span class="${col?'hue k-forced':'flag f'}">Forced</span>`:''}${sdh?`<span class="${col?'hue k-sdh':'flag h'}">For hard of hearing</span>`:''}${!t.d&&!forced&&!sdh?(col?'<span class="hue grey">Full</span>':'Full'):''}</span></td><td>${col?`<span class="chips">${esc(sc[0])}${/image/.test(sc[1])?'<span class="hue k-img">Image</span>':''}</span>`:`${esc(sc[0])}${sc[1]?` <span style="color:var(--dim)">(${esc(sc[1])})</span>`:''}`}</td></tr>`;}).join('')}</tbody></table>`;}
  return h+'</div>';
}
function mediaHtml(r){const m=MEDIA&&MEDIA[r.id];if(!m)return `<p class="note" style="padding:18px 0">No media information was captured for this release.</p>`;return mi2(m,r.res,(mu(r)||{}).tn);}
function filesHtml(r){const f=FILES&&FILES[r.id];if(!f||!f.length)return `<p class="note" style="padding:18px 0">${X(r).files?`This release has ${X(r).files} file${X(r).files===1?'':'s'}. The file names for it were not copied into this prototype.`:'No file list was stored for this release.'}</p>`;
  return `<table class="filelist"><thead><tr><th>File</th><th class="num">Size</th></tr></thead><tbody>${f.map(([n,z])=>`<tr><td>${esc(n)}</td><td class="num">${z?gb(z):'—'}</td></tr>`).join('')}</tbody></table>`;}
let lastFocus=null;
function openDialog(title,r,body,cls=''){lastFocus=document.activeElement;$('#modal').innerHTML=`<div class="scrim" data-close><div class="dlg${cls?' '+cls:''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="dlghead"><div><h2>${esc(title)}</h2><p>${esc(r.name)}</p></div><button class="ia" data-close aria-label="Close">${ic('x')}</button></div><div class="body">${body}</div></div></div>`;$('#modal .ia').focus();}
// full: open straight at full size when the image is larger than the window (the details page's Sample picture, his call 2026-09-29)
function setupImg(full){const img=$('#modal .pvimg');if(!img)return;if(full)img.style.visibility='hidden';const go=()=>{const b=$('#modal .pvbar [data-full]'),dim=$('#modal .pvdim');if(dim)dim.textContent=img.naturalWidth+' × '+img.naturalHeight;if(b&&img.naturalWidth>img.clientWidth+1){b.hidden=false;$('#modal .dlg').classList.add('canfull');if(full)toggleFull();}img.style.visibility='';};img.complete?go():img.addEventListener('load',go);}
function toggleFull(){const d=$('#modal .dlg'),b=$('#modal .pvbar [data-full]');if(!d||!d.classList.contains('canfull'))return;const on=d.classList.toggle('full');b.setAttribute('aria-pressed',on);b.textContent=on?'Fit to window':'Full size';}
</script>

<script>
function closeDialog(){$('#modal').innerHTML='';if(lastFocus&&document.contains(lastFocus))lastFocus.focus();}
const needMedia=()=>MEDIA?Promise.resolve():fetch(DIR+'media.json'+NOCACHE).then(r=>r.json()).then(a=>{MEDIA=a;});
const needNfo=()=>NFO?Promise.resolve():fetch(DIR+'nfo.json'+NOCACHE).then(r=>r.json()).then(a=>{NFO=a;});
const needFiles=()=>FILES?Promise.resolve():fetch(DIR+'files.json'+NOCACHE).then(r=>r.json()).then(a=>{FILES=a;});
const nfoHtml=r=>NFO&&NFO[r.id]&&NFO[r.id].trim()?`<pre class="nfo">${esc(NFO[r.id])}</pre>`:`<p class="note" style="padding:18px 0">${X(r).nfo?'This release has an NFO, but its text was not found in the copy of the data.':'No NFO was posted with this release.'}</p>`;
/* ---------- routing + events ---------- */
function route(){
  const rm=location.hash.match(/^#\/release\/(\d+)$/);if(rm){release(+rm[1]);return;}
  const rp=location.hash.match(/^#\/p\/(\d+)$/);state.page=rp?+rp[1]:1;releasesView();}
function firstPage(){state.page=1;if(location.hash!=='#/'&&location.hash!=='')location.hash='#/';else route();}
function rerender(){const y=scrollY;route();scrollTo(0,y);}
let lastHash='';
addEventListener('hashchange',()=>{state.dd=null;closeDialog();const rid=h=>(h.match(/^#\/release\/(\d+)/)||[])[1];
  if(rid(location.hash)){if(rid(location.hash)!==rid(lastHash)){state.tab='overview';scrollTo(0,0);}lastHash=location.hash;route();return;}
  scrollTo(0,0);lastHash=location.hash;route();});
// the list remembers its last dropdown filters for the user (#881; the app keeps them in the profile, here localStorage stands in);
// the name search is never remembered, and neither is the page
const saveFilters=()=>store.set('filters',JSON.stringify({cat:isExo()?'exo':[...state.cat],genre:[...state.genre],year:state.year,comp:state.comp}));
function loadFilters(){try{const f=JSON.parse(store.get('filters','{}'));state.cat=new Set((f.cat==='exo'?(exoShown()?EXO():[]):(f.cat||[])).filter(v=>CATS.includes(v)));state.genre=new Set((f.genre||[]).filter(v=>GENRES.includes(v)));state.year=HASGEN&&f.year&&typeof f.year==='object'?f.year:null;state.comp=['100','95'].includes(f.comp)?f.comp:false;}catch(e){}}
function afterFilter(){state.page=1;saveFilters();if(location.hash!=='#/'&&location.hash!=='')history.replaceState(null,'','#/');}
document.addEventListener('click',e=>{
  const al=e.target.closest('[data-applink]');if(al){e.preventDefault();toast('Opens '+decodeURIComponent(al.dataset.applink)+', the existing list of all releases for it (not part of this prototype)');return;}
  const dd=e.target.closest('[data-ddtoggle],[data-ddany],[data-ddpick]');
  if(dd){const d=dd.dataset,k=d.ddtoggle||d.ddany||d.ddpick,y=scrollY;
    if(d.ddtoggle){state.dd=state.dd===k?null:k;state.yerr='';route();scrollTo(0,y);placeMenu();($(`[data-msel="${k}"] [data-msearch]`)||$(`[data-ddtoggle="${k}"]`))?.focus();return;}
    const mtop=$('.sfm .mmenu')?.scrollTop;if(d.ddany)state[k].clear();else state[k].has(d.v)?state[k].delete(d.v):state[k].add(d.v);
    afterFilter();route();scrollTo(0,y);const again=d.ddany?$(`[data-ddany="${k}"]`):$(`[data-ddpick="${k}"][data-v="${CSS.escape(d.v)}"]`);placeMenu(mtop);again?.focus({preventScroll:true});return;}
  const yp=e.target.closest('[data-ypick]');
  if(yp){const [kind,v]=yp.dataset.ypick.split(':'),mtop=$('.sfm .mmenu')?.scrollTop,y=scrollY;
    if(kind==='any')state.year=null;else{const cur=new Set(decadesOf(state.year));cur.has(+v)?cur.delete(+v):cur.add(+v);state.year=cur.size?{kind:'decade',vs:[...cur].sort((a,b)=>b-a)}:null;}
    state.yin={a:'',b:''};state.yerr='';afterFilter();route();scrollTo(0,y);placeMenu(mtop);$(`[data-msel="year"] [data-ypick="${yp.dataset.ypick}"]`)?.focus({preventScroll:true});return;}
  const sg=e.target.closest('[data-setgenre]');if(sg){state.cat.clear();state.genre=new Set([sg.dataset.setgenre]);state.year=null;state.yin={a:'',b:''};state.comp=false;state.q='';saveFilters();state.page=1;return;}
  const exb=e.target.closest('[data-ddexo]');if(exb){const y=scrollY,mtop=$('.sfm .mmenu')?.scrollTop;if(isExo())state.cat.clear();else{state.cat.clear();EXO().forEach(c=>state.cat.add(c));}afterFilter();route();scrollTo(0,y);placeMenu(mtop);$('[data-ddexo]')?.focus({preventScroll:true});return;}
  if(state.dd&&!e.target.closest('[data-msel]')){state.dd=null;state.yerr='';rerender();}
  const tb=e.target.closest('[data-tab]');if(tb){state.tab=tb.dataset.tab;rerender();$(`[data-tab="${tb.dataset.tab}"]`)?.focus({preventScroll:true});return;}
  const dso=e.target.closest('[data-dsort]');if(dso){const [key,k]=dso.dataset.dsort.split(':');state[key]=state[key].k===k?{k,dir:-state[key].dir}:{k,dir:k==='cat'?1:-1};rerender();$(`[data-dsort="${dso.dataset.dsort}"]`)?.focus({preventScroll:true});return;}
  if(e.target.closest('[data-clearq]')){state.q='';afterFilter();rerender();$('#q')?.focus();return;}
  if(e.target.closest('[data-clearall]')){state.cat.clear();state.genre.clear();state.year=null;state.yin={a:'',b:''};state.yerr='';state.comp=false;state.q='';afterFilter();rerender();$('.fbar .mbtn')?.focus({preventScroll:true});return;}
  const rpk=e.target.closest('[data-rpick]');if(rpk){const [k,v]=rpk.dataset.rpick.split(':');state[k]=v==='any'?false:v;state.dd=null;afterFilter();rerender();$(`[data-ddtoggle=${k}]`)?.focus({preventScroll:true});return;}
  const cl=e.target.closest('[data-close]');if(cl&&(e.target===cl||cl.tagName==='BUTTON')){closeDialog();return;}
  const cp=e.target.closest('[data-copynzb]');
  if(cp){const r=BYID[cp.dataset.copynzb];copyText(nzbLink(r)).then(ok=>{toast(ok?'NZB link copied. It contains your API key, so only paste it into your own downloader.':'Could not copy. The link is: '+nzbLink(r));if(ok){const svg=cp.querySelector('use');if(svg){svg.setAttribute('href','#i-check');setTimeout(()=>svg.setAttribute('href','#i-link'),1600);}}});return;}
  if(e.target.closest('[data-full]')){toggleFull();return;}
  const u=e.target.closest('[data-nfo],[data-mi],[data-files],[data-listen],[data-spec],[data-bulk]');
  if(u){const d=u.dataset;
    if(d.nfo){const r=BYID[d.nfo];needNfo().then(()=>openDialog('NFO',r,nfoHtml(r)));}
    else if(d.mi){const r=BYID[d.mi];needMedia().then(()=>openDialog('Media information',r,mediaHtml(r)));}
    else if(d.files){const r=BYID[d.files];needFiles().then(()=>openDialog('Files',r,filesHtml(r)));}
    else if(d.listen){const r=BYID[d.listen];
      openDialog('Listen',r,listenHtml(r),'lsnd');}
    else if(d.spec){const r=BYID[d.spec];openDialog('Spectrogram',r,specHtml(r));setupImg(false);}
    else if(d.bulk){const ids=[...state.sel];if(d.bulk==='cart'){ids.forEach(i=>state.cart.add(i));$('#cartn').textContent=state.cart.size;toast(ids.length+' added to the cart');}else if(d.bulk==='nzb')toast('Would download '+ids.length+' NZBs as one zip');state.sel.clear();rerender();}
    return;}
  const t=e.target.closest('[data-nzb],[data-cart],[data-dummy]');if(!t)return;
  if(t.dataset.dummy!==undefined){e.preventDefault();toast('Other and All are not part of this prototype');return;}
  if(t.dataset.nzb){const r=BYID[t.dataset.nzb];toast('Would download the NZB: '+gb(r.size));}
  else if(t.dataset.cart){const id=+t.dataset.cart;state.cart.has(id)?state.cart.delete(id):state.cart.add(id);$('#cartn').textContent=state.cart.size;rerender();$(`[data-cart="${id}"]`)?.focus({preventScroll:true});}
});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.selectall!==undefined){const ids=$$('.feed [data-select]').map(c=>+c.dataset.select);ids.forEach(i=>t.checked?state.sel.add(i):state.sel.delete(i));rerender();$('[data-selectall]')?.focus();return;}
  if(t.dataset.select){const id=+t.dataset.select;t.checked?state.sel.add(id):state.sel.delete(id);rerender();$(`[data-select="${id}"]`)?.focus({preventScroll:true});return;}
  if(t.dataset.rsort!==undefined){state.rsort=t.value;store.set('rsort',t.value);firstPage();$('[data-rsort]')?.focus();}});
// the name search narrows the list as you type (today's 180 ms pause), back to page 1; focus and caret stay in the field
let qTimer=null;
document.addEventListener('input',e=>{if(e.target.id==='yfrom'||e.target.id==='yto'){const v=e.target.value.replace(/\D/g,'');if(e.target.id==='yfrom')state.yin.a=v;else state.yin.b=v;const b=$('[data-yform] button');if(b)b.disabled=!yearReady(state.yin);return;}
  const ms=e.target.dataset?.msearch;if(ms){state.msq[ms]=e.target.value;const q=e.target.value.trim().toLowerCase();$$(`[data-msel="${ms}"] [data-ddpick]`).forEach(b=>{b.hidden=!!q&&!b.textContent.toLowerCase().includes(q);});return;}
  if(e.target.id==='q'){const v=e.target.value;clearTimeout(qTimer);qTimer=setTimeout(()=>{state.q=v;afterFilter();const c=$('#q')?.selectionStart;rerender();const q=$('#q');if(q){q.focus({preventScroll:true});q.setSelectionRange(c,c);}},180);}});
document.addEventListener('submit',e=>{
  const yf=e.target.closest('[data-yform]');
  if(yf){e.preventDefault();const a=+state.yin.a,b=state.yin.b===''?a:+state.yin.b;
    if(!a||!b||a<FIRST_YEAR||b>THIS_YEAR||a>b){state.yerr=`Years run ${FIRST_YEAR}–${THIS_YEAR}, earliest first`;rerender();placeMenu();$('#yfrom')?.focus({preventScroll:true});return;}
    state.year=a===b?{kind:'year',v:a}:{kind:'range',a,b};state.yerr='';state.dd=null;afterFilter();rerender();$('[data-ddtoggle="year"]')?.focus({preventScroll:true});return;}
  const f=e.target.closest('[data-goto]');if(f){e.preventDefault();const n=Math.min(+f.dataset.pages,Math.max(1,parseInt(f.querySelector('input').value,10)||0));if(!n)return;location.hash=pageHref(f.dataset.base||'#/',n);return;}
  if(e.target.closest('.sitesearch')){e.preventDefault();toast('The site-wide release search stays as it is; it is not part of this prototype');}});
$('#cartbtn').addEventListener('click',()=>toast(state.cart.size?state.cart.size+' release'+(state.cart.size===1?'':'s')+' in the cart':'The cart is empty'));
$('#theme').addEventListener('click',()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'light':'dark';});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&e.target.id==='q'&&state.q){state.q='';e.target.value='';afterFilter();rerender();$('#q')?.focus();return;}
  if(e.key==='Escape'&&$('#modal').innerHTML){closeDialog();return;}if(e.key==='Escape'&&state.dd){const k=state.dd;state.dd=null;state.yerr='';rerender();$(`[data-ddtoggle="${k}"]`)?.focus();return;}});
document.addEventListener('focusout',e=>{const m=e.target.closest?.('.msel');if(!m||!state.dd||!e.relatedTarget||m.contains(e.relatedTarget))return;state.dd=null;state.yerr='';m.querySelector('.mmenu')?.remove();m.querySelector('[data-ddtoggle]')?.setAttribute('aria-expanded','false');});

Promise.all([DIR+'data.json',DIR+'relx.json',DIR+'music.json',DIR+'art.json',DIR+'previews.json',DIR+'spectra.json'].map(u=>fetch(u+NOCACHE).then(r=>r.json()))).then(([d,rx,m,art,pv,sp])=>{SPF=sp;RX=rx;MU=m;delete art._note;ART=art;PVF=pv;PVS=new Set(Object.keys(pv));
  REL=d.rel.map(a=>({id:a[0],name:a[1],size:a[2],t:a[3],comp:a[4],grabs:a[5],cat:a[6]}));
  REL.forEach(r=>{BYID[r.id]=r;});
  CAT_ORDER=d.cats;
  // the Category menu lists today's sub-categories that have a release, in the site's order
  {const have=new Set(REL.map(catOf));CATS=CAT_ORDER.filter(c=>have.has(c));}
  // genres are the tags' genre, REAL and as written (one per release). The menu lists the genres its releases have, A to Z
  // (case-insensitive), then Unknown for releases with none
  // a tag that says "Unknown" is the Unknown item, not a genre of its own
  GENRES=[...new Set(REL.flatMap(genOf))].filter(g=>g!=='Unknown').sort((a,b)=>a.localeCompare(b,undefined,{sensitivity:'base'}));if(REL.some(r=>!genOf(r).length||genOf(r).includes('Unknown')))GENRES.push('Unknown');
  PVCOUNT=REL.filter(r=>pvOf(r)).length;
  loadFilters();
  NOW=Math.max(...REL.map(r=>r.t));NOWALL=Math.max(NOW,...REL.map(r=>X(r).added));
  {const r=store.get('rsort','posted_desc');if(['posted_desc','posted_asc','added_desc','added_asc'].includes(r))state.rsort=r;}
  lastHash=location.hash;route();window.READY=true;});
</script>
