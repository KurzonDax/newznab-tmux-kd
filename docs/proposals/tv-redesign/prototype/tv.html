<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NNTmux TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--k-mi-bg:oklch(0.31 0.06 275);--k-mi-fg:oklch(0.87 0.08 275);--k-nfo-bg:oklch(0.31 0.07 345);--k-nfo-fg:oklch(0.87 0.09 345);--k-pv-bg:oklch(0.31 0.05 215);--k-pv-fg:oklch(0.88 0.08 210);--k-sm-bg:oklch(0.33 0.06 110);--k-sm-fg:oklch(0.89 0.10 108);--c-ok-bg:oklch(0.30 0.045 150);--c-ok-fg:oklch(0.86 0.10 150);--c-mid-bg:oklch(0.32 0.05 65);--c-mid-fg:oklch(0.87 0.10 72);--c-low-bg:oklch(0.30 0.055 22);--c-low-fg:oklch(0.84 0.09 22);--r4k-bg:oklch(0.44 0.17 318);--r4k-fg:oklch(0.96 0.04 318);--r1080-bg:oklch(0.44 0.13 255);--r1080-fg:oklch(0.96 0.03 255);--r720-bg:oklch(0.44 0.085 192);--r720-fg:oklch(0.96 0.03 192);--rsd-bg:oklch(0.34 0.012 265);--rsd-fg:oklch(0.86 0.012 265);--bg:#0f1014;--panel:#181a21;--panel2:#20232c;--line:#2b2f3a;--ink:#f4f4f6;--dim:#a4a8b4;--acc:#ff5a3c;--accink:#1d0a05;--ok:#5fd38d;--warn:#f0b755;--bad:#ff7a7a;--shadow:0 18px 40px -14px rgb(0 0 0/.7)}
:root[data-theme=light]{--k-mi-bg:oklch(0.93 0.035 275);--k-mi-fg:oklch(0.40 0.13 275);--k-nfo-bg:oklch(0.93 0.04 345);--k-nfo-fg:oklch(0.42 0.14 350);--k-pv-bg:oklch(0.93 0.04 215);--k-pv-fg:oklch(0.40 0.09 225);--k-sm-bg:oklch(0.93 0.06 108);--k-sm-fg:oklch(0.42 0.09 105);--c-ok-bg:oklch(0.93 0.04 150);--c-ok-fg:oklch(0.38 0.09 150);--c-mid-bg:oklch(0.93 0.045 72);--c-mid-fg:oklch(0.42 0.09 60);--c-low-bg:oklch(0.93 0.035 22);--c-low-fg:oklch(0.42 0.12 25);--r4k-bg:oklch(0.90 0.07 318);--r4k-fg:oklch(0.34 0.16 318);--r1080-bg:oklch(0.90 0.055 255);--r1080-fg:oklch(0.34 0.13 255);--r720-bg:oklch(0.90 0.05 192);--r720-fg:oklch(0.33 0.08 192);--rsd-bg:oklch(0.89 0.008 265);--rsd-fg:oklch(0.36 0.012 265);--bg:#f5f5f2;--panel:#fff;--panel2:#e4e4dd;--line:#d3d3cb;--ink:#17181c;--dim:#5c606b;--acc:#c8331a;--accink:#fff;--ok:#1d7d47;--warn:#8f5d00;--bad:#b3261e;--shadow:0 14px 30px -14px rgb(30 30 20/.35)}
*{box-sizing:border-box;margin:0}
html{scrollbar-color:var(--line) var(--bg)}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 Manrope,system-ui,sans-serif;min-height:100vh}
::selection{background:var(--acc);color:var(--accink)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
svg.i{width:1.1em;height:1.1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:1500px;margin:0 auto;padding:0 40px}

/* nav */
.nav{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:26px;height:68px}
.brand{font-weight:800;font-size:20px;letter-spacing:-.02em}
.nav a.l{color:var(--dim);font-size:15px}
.nav a.l:hover,.nav a.l.on{color:var(--ink)}
.sitesearch{display:flex;align-items:center;margin-left:auto;height:42px;border-radius:21px;background:var(--panel2);color:var(--dim)}
.sitesearch .scope{position:relative;display:flex;align-items:center;height:42px;padding:0 10px 0 16px;border-right:1px solid var(--line)}
.sitesearch .scope select{appearance:none;background:none;border:0;outline:0;color:var(--ink);font:600 14px Manrope,sans-serif;padding-right:18px}
.sitesearch .scope .i{position:absolute;right:8px;width:14px;height:14px;pointer-events:none;transform:rotate(90deg)}
.sitesearch .field{display:flex;align-items:center;gap:8px;height:42px;width:250px;padding:0 16px 0 12px}
.sitesearch input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--ink);caret-color:var(--acc)}
.sitesearch input::placeholder{color:var(--dim)}
.sitesearch:focus-within{box-shadow:0 0 0 2px var(--acc)}
.search{position:relative;width:320px}
.search label{display:flex;align-items:center;gap:8px;height:42px;padding:0 16px;border-radius:21px;background:var(--panel2);color:var(--dim)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--ink);caret-color:var(--acc)}
.search input::placeholder{color:var(--dim)}
.search label:focus-within{box-shadow:0 0 0 2px var(--acc)}
.results{position:absolute;top:48px;left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;max-height:420px;overflow:auto}
.results a{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:center;padding:6px 10px;border-radius:9px}
.results a:hover,.results a.hl{background:var(--panel2)}
.results img,.results .np{width:34px;height:50px;border-radius:5px;object-fit:cover}
.results b{display:block;font-weight:700;font-size:14px}
.results span{font-size:12.5px;color:var(--dim)}
.results p{padding:12px;color:var(--dim);font-size:14px}
.iconbtn{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 14px;border-radius:21px;background:var(--panel2);font-weight:600;font-size:14px}
.iconbtn:hover{background:var(--line)}
.iconbtn em{font-style:normal;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--acc);color:var(--accink);font-size:12px;line-height:20px;text-align:center}

/* filter bar */
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:22px 0 6px}
.filters h1{font:800 30px/1.1 Manrope,sans-serif;letter-spacing:-.025em;margin-right:6px}
.filters .grow{flex:1}
.filters .search label{height:38px;border-radius:19px}
.filters .search input{font-size:13.5px}
.filters .results{top:44px;z-index:12}
.bar2 h2{margin-right:auto}
.fg{display:flex;align-items:center;gap:6px}
.fg span{font-size:13px;color:var(--dim);margin-right:4px}
.pill{display:inline-flex;align-items:center;height:34px;padding:0 14px;border-radius:17px;background:var(--panel2);font-weight:600;font-size:13.5px;color:var(--dim)}
.pill:hover{color:var(--ink)}
.pill[aria-pressed=true]{background:var(--acc);color:var(--accink)}
.note{color:var(--dim);font-size:14px;padding:2px 0 0}
.note button{color:var(--acc);font-weight:500}

/* view switch */
.seg{display:inline-flex;padding:3px;border-radius:20px;background:var(--panel2)}
.seg a,.seg button{display:inline-flex;align-items:center;height:32px;padding:0 16px;border-radius:16px;font-weight:600;font-size:13.5px;color:var(--dim)}
.seg a:hover,.seg button:hover{color:var(--ink)}
.seg [aria-pressed=true]{background:var(--acc);color:var(--accink)}
.sub{display:flex;align-items:center;gap:12px;padding:10px 0 0;color:var(--dim);font-size:14px}
/* show discovery filters */
.dfilters{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:14px 0 0}
.sel{position:relative;display:inline-flex;align-items:center}
.sel select{appearance:none;-webkit-appearance:none;height:38px;padding:0 36px 0 16px;border-radius:19px;border:0;background:var(--panel2);color:var(--ink);font:600 13.5px Manrope,sans-serif;cursor:pointer}
.sel select:hover{background:var(--line)}
.sel.set select{background:var(--acc);color:var(--accink)}
.sel svg{position:absolute;right:13px;pointer-events:none;transform:rotate(90deg);font-size:13px}
.sel.set svg{color:var(--accink)}
.dfilters .count{margin-left:auto;color:var(--dim);font-size:14px}
.person{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 8px 0 16px;border-radius:19px;background:var(--acc);color:var(--accink);font-weight:600;font-size:13.5px}
.person button{display:grid;place-items:center;width:24px;height:24px;border-radius:12px;background:rgb(0 0 0/.22);font-size:12px}
.person button:hover{background:rgb(0 0 0/.4)}
.tile .m2{margin-top:2px;font-size:12.5px;color:var(--dim)}
.showhead .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.tag{display:inline-flex;align-items:center;height:28px;padding:0 12px;border-radius:14px;background:var(--panel2);font-weight:500;font-size:12.5px}
a.tag:hover{background:var(--line)}
.tag.plain{background:none;border:1px solid var(--line)}
.starring{margin-top:14px;font-size:14px;color:var(--dim);max-width:80ch;line-height:1.9}
.starring a{white-space:nowrap;color:var(--ink);font-weight:400;border-bottom:1px solid var(--line)}
.starring a:hover{color:var(--acc);border-color:var(--acc)}
.results h4{padding:8px 10px 4px;font:600 12.5px/1 Manrope,sans-serif;color:var(--dim)}
.results a.p{grid-template-columns:1fr;padding:9px 10px}
.msel{position:relative;display:inline-block}
.mbtn{display:inline-flex;align-items:center;gap:10px;height:38px;padding:0 14px 0 16px;border-radius:19px;background:var(--panel2);font-weight:600;font-size:13.5px;white-space:nowrap}
.mbtn:hover{background:var(--line)}
.mbtn svg{transform:rotate(90deg);font-size:13px}
.msel.set .mbtn{background:var(--acc);color:var(--accink)}
.sfm .mmenu{z-index:15;left:0;right:auto;max-height:min(420px,60vh);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.sfm .mbtn{width:clamp(132px,calc((100vw - 540px)/6),176px);justify-content:space-between;gap:6px;padding:0 12px 0 14px}
.sfm .mbtn .lab{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;text-align:left}
.sfm .mbtn svg{flex:none}
.mmenu{position:absolute;right:0;top:44px;z-index:30;min-width:210px;padding:6px;border-radius:14px;background:var(--panel);box-shadow:var(--shadow)}
.mitem{display:flex;align-items:center;gap:12px;width:100%;height:40px;padding:0 10px;border-radius:9px;text-align:left;font-size:14px}
.mitem:hover{background:var(--panel2)}
.mitem .box{display:grid;place-items:center;width:18px;height:18px;border-radius:5px;border:1.5px solid var(--dim);font-size:13px;flex:none}
.mitem[aria-checked=true] .box{background:var(--acc);border-color:var(--acc);color:var(--accink)}
/* pager */
.pager{display:flex;align-items:center;gap:6px;margin:22px 0;font-variant-numeric:tabular-nums}
.pager.bottom{margin:26px 0 70px}
.pager a,.pager span.cur,.pager span.gap,.pager span.off{display:inline-flex;align-items:center;justify-content:center;min-width:38px;height:38px;padding:0 12px;border-radius:19px;font-weight:600;font-size:14px}
.pager a{background:var(--panel2)}
.pager a:hover{background:var(--line)}
.pager span.cur{background:var(--acc);color:var(--accink)}
.pager span.gap{color:var(--dim);min-width:20px;padding:0}
.pager span.off{background:var(--panel2);color:var(--dim);opacity:.45}
.pager .sum{margin-left:auto;color:var(--dim);font-size:14px;font-weight:400}
.pager.slim{margin:4px 0 0;gap:6px}
.pager.slim .sum{margin:0 auto 0 0}
.pager.slim .pg{padding:0 10px;font-size:14px;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.pager.slim a,.pager.slim span.off{min-width:34px;height:34px;padding:0}
.pager form{display:flex;align-items:center;gap:8px;margin-left:14px;color:var(--dim);font-size:14px}
.pager input{width:64px;height:38px;border-radius:19px;border:0;background:var(--panel2);text-align:center;font-weight:700;color:var(--ink)}
/* release chips */
.rchips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.rc{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:8px;font-weight:500;font-size:13px;white-space:nowrap;background:var(--panel2);color:var(--ink)}
.rc svg{font-size:12px}
button.rc,a.rc{cursor:pointer}
button.rc:hover,a.rc:hover{filter:brightness(1.18)}
:root[data-theme=light] button.rc:hover,:root[data-theme=light] a.rc:hover{filter:brightness(.94)}
.rc.info{background:var(--panel2);color:var(--ink)}
.rc.k-mi{background:var(--k-mi-bg);color:var(--k-mi-fg)}
.rc.k-nfo{background:var(--k-nfo-bg);color:var(--k-nfo-fg);letter-spacing:.04em}
.rc.k-pv{background:var(--k-pv-bg);color:var(--k-pv-fg)}
.rc.k-sm{background:var(--k-sm-bg);color:var(--k-sm-fg)}
.rc.comp.c-ok{background:var(--c-ok-bg);color:var(--c-ok-fg)}
.rc.comp.c-mid{background:var(--c-mid-bg);color:var(--c-mid-fg)}
.rc.comp.c-low{background:var(--c-low-bg);color:var(--c-low-fg)}
.rc.origin{background:none;border:1px solid var(--line);color:var(--dim)}
.rc.origin:hover{color:var(--ink)}
.rname{font-weight:700;font-size:15.5px;line-height:1.3}
.feed .rchips{margin-top:12px;gap:8px}
.feed .rchips:empty{display:none}
.dhead .rname{overflow-wrap:anywhere}
a.rname:hover{color:var(--acc)}
.iconacts{display:flex;gap:4px;justify-content:flex-end}
.iconacts .slot{visibility:hidden}
.ia{display:grid;place-items:center;width:32px;height:32px;border-radius:16px;background:var(--panel2);font-size:15px}
.ia:hover{background:var(--line)}
.ia.dl{background:var(--acc);color:var(--accink)}
.ia.dl[aria-pressed]{background:var(--acc)}
.ia.dl:hover{filter:brightness(1.1)}
.ia[aria-pressed=true]{background:var(--acc);color:var(--accink)}
.filesbtn{color:inherit;font-weight:400;text-decoration:underline dotted;text-underline-offset:4px}
.filesbtn:hover{color:var(--ink);text-decoration:underline}
.bulk{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:40;display:flex;align-items:center;gap:12px;padding:10px 12px 10px 20px;border-radius:28px;background:var(--panel2);box-shadow:var(--shadow);font-weight:500;font-size:14px}
.bulk .btn.sec{background:var(--line)}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--acc);cursor:pointer}
/* dialog */
.scrim{position:fixed;inset:0;z-index:60;background:rgb(5 5 8/.66);display:grid;place-items:center;padding:30px}
.dlg{width:min(860px,100%);max-height:86vh;display:flex;flex-direction:column;background:var(--panel);border-radius:18px;box-shadow:var(--shadow)}
.dlg header{display:flex;align-items:flex-start;gap:14px;padding:20px 22px 14px;border-bottom:1px solid var(--line)}
.dlg header h2{font:800 19px/1.2 Manrope,sans-serif}
.dlg header p{margin-top:4px;font-size:13px;line-height:1.4;color:var(--dim);overflow-wrap:anywhere}
.dlg header button{margin-left:auto}
.dlg .body{padding:6px 22px 22px;overflow:auto}
/* ---- colour: one hue per section, one hue per kind of value; coral stays reserved for actions ---- */
.hue{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:7px;font-size:12.5px;font-weight:600;white-space:nowrap;background:oklch(0.31 0.06 var(--h));color:oklch(0.87 0.08 var(--h))}
:root[data-theme=light] .hue{background:oklch(0.93 0.035 var(--h));color:oklch(0.40 0.13 var(--h))}
.hue.grey{background:var(--panel2);color:var(--ink)}
.hv{--h:275}.ha{--h:185}.hs{--h:85}
.k-dv{--h:340}.k-hdrp{--h:60}.k-hdr{--h:95}.k-atmos{--h:300}
.k-71{--h:300}.k-51{--h:250}.k-20{--h:185}
.k-def{--h:150}.k-forced{--h:45}.k-sdh{--h:215}.k-img{--h:110}
.mi2.col .glance dd{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:8px}
.mi2.col .glance dd small{flex-basis:100%;margin-top:0}
.mi2.col h3{margin-bottom:8px;align-items:center}
.mi2.col .chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.mi2.col .vgrid.hv{border-top-color:oklch(0.6 0.12 275)}
.mi2.col table.ha thead th{border-bottom-color:oklch(0.6 0.1 185)}
.mi2.col table.hs thead th,.mi2.col .langs.hs{border-color:oklch(0.6 0.11 85)}
.mi2.col .langs.hs div{border-bottom-color:var(--line)}
/* ---- the proposed media info block ---- */
.mi2 .glance{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 28px}
.mi2 .glance dt{font-size:12.5px;font-weight:600;color:var(--dim)}
.mi2 .glance dd{margin-top:4px;font-size:16px;font-weight:600;line-height:1.3}
.mi2 .glance dd small{display:block;margin-top:3px;font-size:13px;font-weight:400;color:var(--dim)}
.mi2 h3{display:flex;align-items:baseline;gap:8px;margin:34px 0 4px;font:800 15px/1.2 Manrope,sans-serif}
.mi2 h3 small{font:500 12.5px/1 Manrope,sans-serif;color:var(--dim)}
.mi2 table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13.5px;font-variant-numeric:tabular-nums}
.mi2 th{text-align:left;font-weight:600;font-size:12px;color:var(--dim);padding:8px 12px 8px 0;border-bottom:1px solid var(--line);white-space:nowrap}
.mi2 td{padding:10px 12px 10px 0;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}
.mi2 tr:last-child td{border-bottom:0}
.mi2 td.n,.mi2 th.n{width:34px;color:var(--dim)}
.mi2 td.lead{font-weight:600;font-size:14px}
.mi2 td .sub{display:block;padding:0;color:var(--dim);font-weight:400;font-size:12.5px;margin-top:1px}
.mi2 .num{text-align:right;padding-right:0}
.mi2 .flag{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:11px;font-size:12px;font-weight:600;margin-right:5px;background:var(--k-mi-bg);color:var(--k-mi-fg)}
.mi2 .flag.f{background:var(--c-mid-bg);color:var(--c-mid-fg)}
.mi2 .flag.h{background:var(--k-pv-bg);color:var(--k-pv-fg)}
.mi2 .vgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 28px;padding-top:12px;border-top:1px solid var(--line)}
.mi2 .vgrid dt{font-size:12.5px;font-weight:600;color:var(--dim)}
.mi2 .vgrid dd{margin-top:3px;font-weight:500;font-variant-numeric:tabular-nums}
.mi2 .langs{display:grid;grid-template-columns:repeat(4,1fr);gap:0 28px;padding-top:6px;border-top:1px solid var(--line);font-size:13.5px}
.mi2 .langs div{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.mi2 .langs span{color:var(--dim);font-variant-numeric:tabular-nums}
.dlg .mi2 .glance,.dlg .mi2 .vgrid{gap:16px 20px}
.dlg .mi2 .langs{grid-template-columns:repeat(3,1fr)}
.dlg .mi2{padding-top:14px}
.nfo{margin:14px 0 0;padding:16px;border-radius:12px;background:var(--bg);font:400 12.5px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre;overflow:auto;max-height:62vh;color:var(--ink)}
.pvimg{display:block;max-width:100%;max-height:70vh;margin:0 auto;border-radius:10px}
.pvbar{display:flex;align-items:center;gap:12px;min-height:32px;margin:12px 0 10px;color:var(--dim);font-size:13px;font-variant-numeric:tabular-nums}
.pvbar .btn{margin-left:auto;background:var(--line)}
.pvbar .btn[aria-pressed=true]{background:var(--acc);color:var(--accink)}
.pvwrap{display:block;width:100%;cursor:default}
.dlg.canfull .pvwrap{cursor:zoom-in}
.dlg.full{width:auto;max-width:calc(100vw - 60px);max-height:calc(100vh - 60px)}
.dlg.full .pvwrap{cursor:zoom-out;width:auto}
.dlg.full .pvimg{max-width:none;max-height:none}
.pvthumb{display:block;margin-bottom:18px;border-radius:12px;overflow:hidden}
.pvthumb img{display:block;max-width:100%;max-height:260px}
.pvthumb:hover{filter:brightness(1.08)}
/* release details page */
.crumbs{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:22px;color:var(--dim);font-size:14px;font-weight:600}
.crumbs a:hover{color:var(--ink)}
.dhead{display:grid;grid-template-columns:190px 1fr;gap:28px;margin-top:16px;align-items:start}
