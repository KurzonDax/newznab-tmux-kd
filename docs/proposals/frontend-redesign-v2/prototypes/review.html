}
function openDialog(label,content){document.getElementById('dialogLabel').textContent=label;document.getElementById('dialogContent').innerHTML=content;if(!modal.open)modal.showModal();modal.scrollTop=0}
function renderDirectoryGrid(){const filtered=directoryShows.filter(show=>(!directorySearch||show.title.toLowerCase().includes(directorySearch.toLowerCase()))&&(!directoryNetwork||show.network===directoryNetwork)&&(directoryAvailability==='all'||show.releases>0)).sort((a,b)=>a.title.localeCompare(b.title));document.getElementById('directoryCount').textContent=filtered.length+' shows';document.getElementById('directoryGrid').innerHTML=filtered.length?filtered.map(show=>`<article class="show-card"><button class="poster" style="--hue:${show.color}" data-open-show="${show.id}" aria-label="Open ${show.title}" aria-haspopup="dialog"></button><button class="directory-watch" data-demo-watch aria-label="Watch ${show.title}" title="Watch ${show.title}"><i class="far fa-heart" aria-hidden="true"></i></button><div class="card-content"><button class="title-button" data-open-show="${show.id}" aria-haspopup="dialog">${show.title}</button><p class="directory-genres">${show.year} · ${show.genres.join(' · ')}</p><div class="card-meta"><span class="pill">${show.network}</span></div><div class="directory-state-chips"><span class="directory-chip"><i class="fas fa-layer-group" aria-hidden="true"></i>${show.seasons} ${show.seasons===1?'season':'seasons'}</span><span class="directory-chip ${show.status==='Continuing'?'series-continuing':'series-ended'}"><i class="fas ${show.status==='Continuing'?'fa-play':'fa-stop'}" aria-hidden="true"></i>${show.status}</span></div><div class="directory-release-state"><span class="directory-chip ${show.releases>0?'has-releases':'no-releases'}"><i class="fas ${show.releases>0?'fa-circle-check':'fa-circle-minus'}" aria-hidden="true"></i>${show.releases>0?'Releases available':'No releases available'}</span></div></div></article>`).join(''):'<p class="empty">No shows match these filters.</p>'}
let selectedShowId=2,selectedSeason=4;
const seasonStates=new Map();
function seasonState(){const key=selectedShowId+'-'+selectedSeason;if(!seasonStates.has(key))seasonStates.set(key,{page:1,per:24,packsOpen:false,packsPage:1,packsPer:24,expanded:new Map()});return seasonStates.get(key)}
function seasonEpisodeCount(){return selectedShow().releases===0?0:selectedShowId===2&&selectedSeason===4?30:12}
function seasonPackCount(){return selectedShow().releases===0?0:selectedShowId===2&&selectedSeason===4?40:2}
function selectedShow(){return shows.find(s=>s.id===selectedShowId)}
function episodeReleaseCount(ep){return selectedShowId===2&&selectedSeason===4&&ep===1?60:2}
function episodeCode(ep){return 'S'+String(selectedSeason).padStart(2,'0')+'E'+String(ep).padStart(2,'0')}
function episodeName(ep){return ep===1?'First Light':ep===2?'The Crossing':'Episode '+ep}
function listControls(key,page,total,per){return `<div class="inline-list-controls"><label>Per page <select data-show-per="${key}" aria-label="${key==='episodes'?'Episodes':key==='packs'?'Full-season releases':'Episode releases'} per page">${[24,48,100].map(n=>`<option value="${n}" ${n===per?'selected':''}>${n}</option>`).join('')}</select></label>${pager('show-'+key,page,total,per)}</div>`}
function showReleaseRows(kind,ep,page,per){const total=kind==='packs'?seasonPackCount():episodeReleaseCount(ep),start=(page-1)*per,show=shows.find(s=>s.id===selectedShowId);return Array.from({length:Math.min(per,total-start)},(_,i)=>{const n=start+i+1;return {...r(`${selectedShowId}-s${selectedSeason}-${kind}-${ep}-${n}`,`${show.title} - ${kind==='packs'?'S'+String(selectedSeason).padStart(2,'0')+' COMPLETE':episodeCode(ep)+' - '+episodeName(ep)} [1080p AVC] - Release ${n}`,kind==='packs'?18.4:1.2+(n%5),40+n,'1 day ago'),showId:show.id,completion:n===2?87:100,repair:n===2,nfo:n%2===0,preview:n%3===0}})}
function showSeasonContent(){if(!selectedShow().releases)return '<div class="empty">No releases are available for this show.</div>';const state=seasonState(),start=(state.page-1)*state.per;return `<section id="show-packs" class="show-pack-section"><div class="episode"><div><h3>Full season releases</h3><div class="muted">${seasonPackCount()} releases · Listed once for this season</div></div><button data-toggle-packs aria-expanded="${state.packsOpen}" aria-controls="show-pack-releases">${state.packsOpen?'Hide releases':'View releases'}</button></div><div id="show-pack-releases" ${state.packsOpen?'':'hidden'}>${state.packsOpen?listControls('packs',state.packsPage,seasonPackCount(),state.packsPer)+'<div class="demo-list">'+releaseMarkup(showReleaseRows('packs',0,state.packsPage,state.packsPer))+'</div>'+pager('show-packs',state.packsPage,seasonPackCount(),state.packsPer):''}</div></section><section id="show-episodes"><h3>Episodes</h3>${listControls('episodes',state.page,seasonEpisodeCount(),state.per)}${Array.from({length:Math.min(state.per,seasonEpisodeCount()-start)},(_,i)=>{const ep=start+i+1,expanded=state.expanded.get(ep);return `<section class="show-episode" id="show-episode-${ep}"><div class="episode"><div><strong>${episodeCode(ep)} · ${episodeName(ep)}</strong><div class="muted">${episodeReleaseCount(ep)} episode releases</div></div><button data-toggle-episode="${ep}" aria-expanded="${!!expanded}" aria-controls="show-episode-releases-${ep}">${expanded?'Hide releases':'View releases'}</button></div><div id="show-episode-releases-${ep}" ${expanded?'':'hidden'}>${expanded?listControls('episode-'+ep,expanded.page,episodeReleaseCount(ep),expanded.per)+'<div class="demo-list">'+releaseMarkup(showReleaseRows('episode',ep,expanded.page,expanded.per))+'</div>'+pager('show-episode-'+ep,expanded.page,episodeReleaseCount(ep),expanded.per):''}</div></section>`}).join('')}${pager('show-episodes',state.page,seasonEpisodeCount(),state.per)}</section>`}
function updateShowSeason(anchor){document.getElementById('show-season-content').innerHTML=showSeasonContent();if(anchor){document.getElementById(anchor)?.scrollIntoView({block:'start'});}}
function openShow(){const show=shows.find(s=>s.id===selectedShowId),maxSeason=show.seasons;openDialog('TV Shows › '+show.title,`<div class="detail-hero">${art()}<div><h2>${show.title} <span class="muted">${show.year}</span></h2><p class="episode-genres">${show.genres.join(' · ')}</p><div class="tags"><span class="pill">${show.network}</span><button class="watch" data-demo-watch>♡ Watch</button></div><p class="sample-caption">${show.summary}</p><p class="sample-caption">${maxSeason} seasons · ${show.status}</p></div></div><nav class="season-tabs" aria-label="Seasons">${Array.from({length:maxSeason},(_,i)=>`<button data-show-season="${i+1}" class="${selectedSeason===i+1?'active':''}" aria-pressed="${selectedSeason===i+1}">Season ${i+1}</button>`).join('')}</nav><div id="show-season-content">${showSeasonContent()}</div>`);modal.classList.add('show-review-dialog');const tab=modal.querySelector('[data-show-season].active');tab.parentElement.scrollLeft=Math.max(0,tab.offsetLeft-tab.parentElement.offsetLeft-tab.parentElement.clientWidth+tab.offsetWidth);}
function showListPage(key,page){const state=seasonState();if(key==='episodes'){state.page=page;updateShowSeason('show-episodes')}else if(key==='packs'){state.packsPage=page;updateShowSeason('show-packs')}else{const ep=+key.replace('episode-','');state.expanded.get(ep).page=page;updateShowSeason('show-episode-'+ep)}}
function feedback(s){document.getElementById('toast').textContent=s;setTimeout(()=>document.getElementById('toast').textContent='',3500)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.topic){topic=b.dataset.topic;render()}if(b.dataset.scale){scale=b.dataset.scale;render()}if(b.dataset.variants){const g=groups.find(x=>x.code===b.dataset.variants);openDialog('Episode-specific release list','<h2>Northbound · '+g.code+' · '+g.name+'</h2><p class="sample-caption">4 releases containing this episode</p><div class="demo-list">'+releaseMarkup([...g.rows,r(g.code+'-extra','Northbound - '+g.code+' [720p AVC]-DEMO',0.8,20,'1 day ago'),r('season-pack','Northbound - S03 COMPLETE [1080p AVC]-DEMO',12.8,124,'2 days ago')])+'</div>')}if(b.id==='directoryReset'){directorySearch='';directoryNetwork='';directoryAvailability='all';render()}if(b.dataset.openShow){selectedShowId=+b.dataset.openShow;selectedSeason=selectedShow().seasons;openShow()}if(b.dataset.showSeason){selectedSeason=+b.dataset.showSeason;openShow()}if(b.hasAttribute('data-toggle-packs')){seasonState().packsOpen=!seasonState().packsOpen;updateShowSeason()}if(b.dataset.toggleEpisode){const ep=+b.dataset.toggleEpisode,state=seasonState();state.expanded.has(ep)?state.expanded.delete(ep):state.expanded.set(ep,{page:1,per:24});updateShowSeason()}if(b.dataset.page?.startsWith('show-'))showListPage(b.dataset.page.slice(5),+b.dataset.to);if(b.dataset.cart){cart.has(b.dataset.cart)?cart.delete(b.dataset.cart):cart.add(b.dataset.cart);document.querySelectorAll('[data-cart]').forEach(x=>{x.dataset.inBasket=cart.has(x.dataset.cart)?'1':'0';x.setAttribute('aria-pressed',cart.has(x.dataset.cart))});feedback('Prototype basket: '+cart.size+' releases')}if(b.dataset.download||b.dataset.details||b.dataset.report||b.dataset.fact||b.dataset.releaseWatch||b.hasAttribute('data-demo-watch')||b.hasAttribute('data-demo-link'))feedback('Prototype only: '+(b.dataset.download?'download':b.dataset.report?'report':b.dataset.fact||b.dataset.details?'details':'Watch picker')+' action. No live request sent.');});
document.addEventListener('input',e=>{if(e.target.id==='directorySearch'){directorySearch=e.target.value;renderDirectoryGrid()}});
document.addEventListener('change',e=>{if(e.target.id==='directoryNetwork'){directoryNetwork=e.target.value;renderDirectoryGrid()}if(e.target.id==='directoryAvailability'){directoryAvailability=e.target.value;renderDirectoryGrid()}const key=e.target.dataset.showPer;if(!key)return;const state=seasonState(),per=+e.target.value;if(key==='episodes'){state.per=per;state.page=1;updateShowSeason('show-episodes')}else if(key==='packs'){state.packsPer=per;state.packsPage=1;updateShowSeason('show-packs')}else{const ep=+key.replace('episode-','');state.expanded.set(ep,{page:1,per});updateShowSeason('show-episode-'+ep)}});
modal.addEventListener('close',()=>{if(!modal.open)modal.classList.remove('show-review-dialog')});
document.getElementById('closeReviewModal').onclick=()=>modal.close();let outside=false;function backdrop(e){const r=modal.getBoundingClientRect();return e.target===modal&&(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)}modal.addEventListener('pointerdown',e=>outside=backdrop(e));modal.addEventListener('click',e=>{if(outside&&backdrop(e))modal.close();outside=false});render();
</script></body></html>
