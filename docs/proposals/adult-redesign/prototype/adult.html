<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NNTmux Adult</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--k-mi-bg:oklch(0.31 0.06 275);--k-mi-fg:oklch(0.87 0.08 275);--k-nfo-bg:oklch(0.31 0.07 345);--k-nfo-fg:oklch(0.87 0.09 345);--k-pv-bg:oklch(0.31 0.05 215);--k-pv-fg:oklch(0.88 0.08 210);--k-sm-bg:oklch(0.33 0.06 110);--k-sm-fg:oklch(0.89 0.10 108);--c-ok-bg:oklch(0.30 0.045 150);--c-ok-fg:oklch(0.86 0.10 150);--c-mid-bg:oklch(0.32 0.05 65);--c-mid-fg:oklch(0.87 0.10 72);--c-low-bg:oklch(0.30 0.055 22);--c-low-fg:oklch(0.84 0.09 22);--r4k-bg:oklch(0.44 0.17 318);--r4k-fg:oklch(0.96 0.04 318);--r1080-bg:oklch(0.44 0.13 255);--r1080-fg:oklch(0.96 0.03 255);--r720-bg:oklch(0.44 0.085 192);--r720-fg:oklch(0.96 0.03 192);--rsd-bg:oklch(0.34 0.012 265);--rsd-fg:oklch(0.86 0.012 265);--bg:#0f1014;--panel:#181a21;--panel2:#20232c;--line:#2b2f3a;--ink:#f4f4f6;--dim:#a4a8b4;--acc:#ff5a3c;--accink:#1d0a05;--ok:#5fd38d;--warn:#f0b755;--bad:#ff7a7a;--shadow:0 18px 40px -14px rgb(0 0 0/.7)}
:root[data-theme=light]{--k-mi-bg:oklch(0.93 0.035 275);--k-mi-fg:oklch(0.40 0.13 275);--k-nfo-bg:oklch(0.93 0.04 345);--k-nfo-fg:oklch(0.42 0.14 350);--k-pv-bg:oklch(0.93 0.04 215);--k-pv-fg:oklch(0.40 0.09 225);--k-sm-bg:oklch(0.93 0.06 108);--k-sm-fg:oklch(0.42 0.09 105);--c-ok-bg:oklch(0.93 0.04 150);--c-ok-fg:oklch(0.38 0.09 150);--c-mid-bg:oklch(0.93 0.045 72);--c-mid-fg:oklch(0.42 0.09 60);--c-low-bg:oklch(0.93 0.035 22);--c-low-fg:oklch(0.42 0.12 25);--r4k-bg:oklch(0.90 0.07 318);--r4k-fg:oklch(0.34 0.16 318);--r1080-bg:oklch(0.90 0.055 255);--r1080-fg:oklch(0.34 0.13 255);--r720-bg:oklch(0.90 0.05 192);--r720-fg:oklch(0.33 0.08 192);--rsd-bg:oklch(0.89 0.008 265);--rsd-fg:oklch(0.36 0.012 265);--bg:#f5f5f2;--panel:#fff;--panel2:#e4e4dd;--line:#d3d3cb;--ink:#17181c;--dim:#5c606b;--acc:#c8331a;--accink:#fff;--ok:#1d7d47;--warn:#8f5d00;--bad:#b3261e;--shadow:0 14px 30px -14px rgb(30 30 20/.35)}
*{box-sizing:border-box;margin:0}
html{scrollbar-color:var(--line) var(--bg)}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 Manrope,system-ui,sans-serif;min-height:100vh}
::selection{background:var(--acc);color:var(--accink)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
svg.i{width:1.1em;height:1.1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:1500px;margin:0 auto;padding:0 40px}

/* nav */
.nav{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:26px;height:68px}
.brand{font-weight:800;font-size:20px;letter-spacing:-.02em}
.nav a.l{color:var(--dim);font-size:15px}
.nav a.l:hover,.nav a.l.on{color:var(--ink)}
.sitesearch{display:flex;align-items:center;margin-left:auto;height:42px;border-radius:21px;background:var(--panel2);color:var(--dim)}
.sitesearch .scope{position:relative;display:flex;align-items:center;height:42px;padding:0 10px 0 16px;border-right:1px solid var(--line)}
.sitesearch .scope select{appearance:none;background:none;border:0;outline:0;color:var(--ink);font:600 14px Manrope,sans-serif;padding-right:18px}
.sitesearch .scope .i{position:absolute;right:8px;width:14px;height:14px;pointer-events:none;transform:rotate(90deg)}
.sitesearch .field{display:flex;align-items:center;gap:8px;height:42px;width:250px;padding:0 16px 0 12px}
.sitesearch input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--ink);caret-color:var(--acc)}
.sitesearch input::placeholder{color:var(--dim)}
.sitesearch:focus-within{box-shadow:0 0 0 2px var(--acc)}
.search{position:relative;width:320px}
.search label{display:flex;align-items:center;gap:8px;height:42px;padding:0 16px;border-radius:21px;background:var(--panel2);color:var(--dim)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--ink);caret-color:var(--acc)}
.search input::placeholder{color:var(--dim)}
.search label:focus-within{box-shadow:0 0 0 2px var(--acc)}
.results{position:absolute;top:48px;left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;max-height:420px;overflow:auto}
.results a{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:center;padding:6px 10px;border-radius:9px}
.results a:hover,.results a.hl{background:var(--panel2)}
.results img,.results .np{width:34px;height:50px;border-radius:5px;object-fit:cover}
.results b{display:block;font-weight:700;font-size:14px}
.results span{font-size:12.5px;color:var(--dim)}
.results p{padding:12px;color:var(--dim);font-size:14px}
.iconbtn{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 14px;border-radius:21px;background:var(--panel2);font-weight:600;font-size:14px}
.iconbtn:hover{background:var(--line)}
.iconbtn em{font-style:normal;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--acc);color:var(--accink);font-size:12px;line-height:20px;text-align:center}

/* filter bar */
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:22px 0 6px}
.filters h1{font:800 30px/1.1 Manrope,sans-serif;letter-spacing:-.025em;margin-right:6px}
.filters .grow{flex:1}
.filters .search label{height:38px;border-radius:19px}
.filters .search input{font-size:13.5px}
.filters .results{top:44px;z-index:12}
.bar2 h2{margin-right:auto}
.fg{display:flex;align-items:center;gap:6px}
.fg span{font-size:13px;color:var(--dim);margin-right:4px}
.pill{display:inline-flex;align-items:center;height:34px;padding:0 14px;border-radius:17px;background:var(--panel2);font-weight:600;font-size:13.5px;color:var(--dim)}
.pill:hover{color:var(--ink)}
.pill[aria-pressed=true]{background:var(--acc);color:var(--accink)}
.note{color:var(--dim);font-size:14px;padding:2px 0 0}
.note button{color:var(--acc);font-weight:500}

/* view switch */
.seg{display:inline-flex;padding:3px;border-radius:20px;background:var(--panel2)}
.seg a,.seg button{display:inline-flex;align-items:center;height:32px;padding:0 16px;border-radius:16px;font-weight:600;font-size:13.5px;color:var(--dim)}
.seg a:hover,.seg button:hover{color:var(--ink)}
.seg [aria-pressed=true],.seg [aria-current=page]{background:var(--acc);color:var(--accink)}
.seg [aria-pressed=true]:hover,.seg [aria-current=page]:hover{color:var(--accink)}
.sub{display:flex;align-items:center;gap:12px;padding:10px 0 0;color:var(--dim);font-size:14px}
/* show discovery filters */
.dfilters{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:14px 0 0}
.sel{position:relative;display:inline-flex;align-items:center}
.sel select{appearance:none;-webkit-appearance:none;height:38px;padding:0 36px 0 16px;border-radius:19px;border:0;background:var(--panel2);color:var(--ink);font:600 13.5px Manrope,sans-serif;cursor:pointer}
.sel select:hover{background:var(--line)}
.sel.set select{background:var(--acc);color:var(--accink)}
.sel svg{position:absolute;right:13px;pointer-events:none;transform:rotate(90deg);font-size:13px}
.sel.set svg{color:var(--accink)}
.dfilters .count{margin-left:auto;color:var(--dim);font-size:14px}
.person{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 8px 0 16px;border-radius:19px;background:var(--acc);color:var(--accink);font-weight:600;font-size:13.5px}
.person button{display:grid;place-items:center;width:24px;height:24px;border-radius:12px;background:rgb(0 0 0/.22);font-size:12px}
.person button:hover{background:rgb(0 0 0/.4)}
.tile .m2{margin-top:2px;font-size:12.5px;color:var(--dim)}
.showhead .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.tag{display:inline-flex;align-items:center;height:28px;padding:0 12px;border-radius:14px;background:var(--panel2);font-weight:500;font-size:12.5px}
a.tag:hover{background:var(--line)}
.tag.plain{background:none;border:1px solid var(--line)}
.starring{margin-top:14px;font-size:14px;color:var(--dim);max-width:80ch;line-height:1.9}
.starring a{white-space:nowrap;color:var(--ink);font-weight:400;border-bottom:1px solid var(--line)}
.starring a:hover{color:var(--acc);border-color:var(--acc)}
.results h4{padding:8px 10px 4px;font:600 12.5px/1 Manrope,sans-serif;color:var(--dim)}
.results a.p{grid-template-columns:1fr;padding:9px 10px}
.msel{position:relative;display:inline-block}
.mbtn{display:inline-flex;align-items:center;gap:10px;height:38px;padding:0 14px 0 16px;border-radius:19px;background:var(--panel2);font-weight:600;font-size:13.5px;white-space:nowrap}
.mbtn:hover{background:var(--line)}
.mbtn svg{transform:rotate(90deg);font-size:13px}
.msel.set .mbtn{background:var(--acc);color:var(--accink)}
.sfm .mmenu{z-index:15;left:0;right:auto;max-height:min(420px,60vh);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.sfm .mbtn{width:clamp(132px,calc((100vw - 540px)/6),176px);justify-content:space-between;gap:6px;padding:0 12px 0 14px}
.sfm .mbtn .lab{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;text-align:left}
.sfm .mbtn svg{flex:none}
.mmenu{position:absolute;right:0;top:44px;z-index:30;min-width:210px;padding:6px;border-radius:14px;background:var(--panel);box-shadow:var(--shadow)}
.mitem{display:flex;align-items:center;gap:12px;width:100%;height:40px;padding:0 10px;border-radius:9px;text-align:left;font-size:14px}
.mitem:hover{background:var(--panel2)}
.mitem .box{display:grid;place-items:center;width:18px;height:18px;border-radius:5px;border:1.5px solid var(--dim);font-size:13px;flex:none}
.mitem[aria-checked=true] .box{background:var(--acc);border-color:var(--acc);color:var(--accink)}
/* pager */
.pager{display:flex;align-items:center;gap:6px;margin:22px 0;font-variant-numeric:tabular-nums}
.pager.bottom{margin:26px 0 70px}.list-end{height:70px}
.pager a,.pager span.cur,.pager span.gap,.pager .off{display:inline-flex;align-items:center;justify-content:center;min-width:38px;height:38px;padding:0 12px;border-radius:19px;font-weight:600;font-size:14px}
.pager a{background:var(--panel2)}
.pager a:hover{background:var(--line)}
.pager span.cur{background:var(--acc);color:var(--accink)}
.pager span.gap{color:var(--dim);min-width:20px;padding:0}
.pager .off{background:var(--panel2);color:var(--dim);opacity:.45;cursor:default}
.pager .sum{margin-left:auto;color:var(--dim);font-size:14px;font-weight:400}
.pager.slim{margin:4px 0 0;gap:6px}
.pager.slim .sum{margin:0 auto 0 0}
.pager.slim .pg{padding:0 10px;font-size:14px;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.pager.slim a,.pager.slim .off{min-width:34px;height:34px;padding:0}
.pager form{display:flex;align-items:center;gap:8px;margin-left:14px;color:var(--dim);font-size:14px}
.pager input{width:64px;height:38px;border-radius:19px;border:0;background:var(--panel2);text-align:center;font-weight:700;color:var(--ink)}
/* release chips */
.rchips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.rc{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:8px;font-weight:500;font-size:13px;white-space:nowrap;background:var(--panel2);color:var(--ink)}
.rc svg{font-size:12px}
button.rc,a.rc{cursor:pointer}
button.rc:hover,a.rc:hover{filter:brightness(1.18)}
:root[data-theme=light] button.rc:hover,:root[data-theme=light] a.rc:hover{filter:brightness(.94)}
.rc.info{background:var(--panel2);color:var(--ink)}
.rc.k-mi{background:var(--k-mi-bg);color:var(--k-mi-fg)}
.rc.k-nfo{background:var(--k-nfo-bg);color:var(--k-nfo-fg);letter-spacing:.04em}
.rc.k-pv{background:var(--k-pv-bg);color:var(--k-pv-fg)}
.rc.k-sm{background:var(--k-sm-bg);color:var(--k-sm-fg)}
.rc.comp.c-ok{background:var(--c-ok-bg);color:var(--c-ok-fg)}
.rc.comp.c-mid{background:var(--c-mid-bg);color:var(--c-mid-fg)}
.rc.comp.c-low{background:var(--c-low-bg);color:var(--c-low-fg)}
.rc.origin{background:none;border:1px solid var(--line);color:var(--dim)}
.rc.origin:hover{color:var(--ink)}
.rname{font-weight:700;font-size:15.5px;line-height:1.3}
.feed .rchips{margin-top:12px;gap:8px}
.feed .rchips:empty{display:none}
.dhead .rname{overflow-wrap:anywhere}
a.rname:hover{color:var(--acc)}
.iconacts{display:flex;gap:4px;justify-content:flex-end}
.iconacts .slot{visibility:hidden}
.ia{display:grid;place-items:center;width:32px;height:32px;border-radius:16px;background:var(--panel2);font-size:15px}
.ia:hover{background:var(--line)}
.ia.dl{background:var(--acc);color:var(--accink)}
.ia.dl[aria-pressed]{background:var(--acc)}
.ia.dl:hover{filter:brightness(1.1)}
.ia[aria-pressed=true]{background:var(--acc);color:var(--accink)}
.filesbtn{color:inherit;font-weight:400;text-decoration:underline dotted;text-underline-offset:4px}
.filesbtn:hover{color:var(--ink);text-decoration:underline}
.bulk{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:40;display:flex;align-items:center;gap:12px;padding:10px 12px 10px 20px;border-radius:28px;background:var(--panel2);box-shadow:var(--shadow);font-weight:500;font-size:14px}
.bulk .btn.sec{background:var(--line)}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--acc);cursor:pointer}
/* dialog */
.scrim{position:fixed;inset:0;z-index:60;background:rgb(5 5 8/.66);display:grid;place-items:center;padding:30px}
.dlg{width:min(860px,100%);max-height:86vh;display:flex;flex-direction:column;background:var(--panel);border-radius:18px;box-shadow:var(--shadow)}
.dlg .dlghead{display:flex;align-items:flex-start;gap:14px;padding:20px 22px 14px;border-bottom:1px solid var(--line)}
.dlg .dlghead h2{font:800 19px/1.2 Manrope,sans-serif}
.dlg .dlghead p{margin-top:4px;font-size:13px;line-height:1.4;color:var(--dim);overflow-wrap:anywhere}
.dlg .dlghead button{margin-left:auto}
.dlg .body{padding:6px 22px 22px;overflow:auto}
/* ---- colour: one hue per section, one hue per kind of value; coral stays reserved for actions ---- */
.hue{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:7px;font-size:12.5px;font-weight:600;white-space:nowrap;background:oklch(0.31 0.06 var(--h));color:oklch(0.87 0.08 var(--h))}
:root[data-theme=light] .hue{background:oklch(0.93 0.035 var(--h));color:oklch(0.40 0.13 var(--h))}
.hue.grey{background:var(--panel2);color:var(--ink)}
.hv{--h:275}.ha{--h:185}.hs{--h:85}
.k-dv{--h:340}.k-hdrp{--h:60}.k-hdr{--h:95}.k-atmos{--h:300}
.k-71{--h:300}.k-51{--h:250}.k-20{--h:185}
.k-def{--h:150}.k-forced{--h:45}.k-sdh{--h:215}.k-img{--h:110}
.mi2.col .glance dd{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:8px}
.mi2.col .glance dd small{flex-basis:100%;margin-top:0}
.mi2.col h3{margin-bottom:8px;align-items:center}
.mi2.col .chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.mi2.col .vgrid.hv{border-top-color:oklch(0.6 0.12 275)}
.mi2.col table.ha thead th{border-bottom-color:oklch(0.6 0.1 185)}
.mi2.col table.hs thead th,.mi2.col .langs.hs{border-color:oklch(0.6 0.11 85)}
.mi2.col .langs.hs div{border-bottom-color:var(--line)}
/* ---- the proposed media info block ---- */
.mi2 .glance{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 28px}
.mi2 .glance dt{font-size:12.5px;font-weight:600;color:var(--dim)}
.mi2 .glance dd{margin-top:4px;font-size:16px;font-weight:600;line-height:1.3}
.mi2 .glance dd small{display:block;margin-top:3px;font-size:13px;font-weight:400;color:var(--dim)}
.mi2 h3{display:flex;align-items:baseline;gap:8px;margin:34px 0 4px;font:800 15px/1.2 Manrope,sans-serif}
.mi2 h3 small{font:500 12.5px/1 Manrope,sans-serif;color:var(--dim)}
.mi2 table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13.5px;font-variant-numeric:tabular-nums}
.mi2 th{text-align:left;font-weight:600;font-size:12px;color:var(--dim);padding:8px 12px 8px 0;border-bottom:1px solid var(--line);white-space:nowrap}
.mi2 td{padding:10px 12px 10px 0;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}
.mi2 tr:last-child td{border-bottom:0}
.mi2 td.n,.mi2 th.n{width:34px;color:var(--dim)}
.mi2 td.lead{font-weight:600;font-size:14px}
.mi2 td .sub{display:block;padding:0;color:var(--dim);font-weight:400;font-size:12.5px;margin-top:1px}
.mi2 .num{text-align:right;padding-right:0}
.mi2 .flag{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:11px;font-size:12px;font-weight:600;margin-right:5px;background:var(--k-mi-bg);color:var(--k-mi-fg)}
.mi2 .flag.f{background:var(--c-mid-bg);color:var(--c-mid-fg)}
.mi2 .flag.h{background:var(--k-pv-bg);color:var(--k-pv-fg)}
.mi2 .vgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 28px;padding-top:12px;border-top:1px solid var(--line)}
.mi2 .vgrid dt{font-size:12.5px;font-weight:600;color:var(--dim)}
.mi2 .vgrid dd{margin-top:3px;font-weight:500;font-variant-numeric:tabular-nums}
.mi2 .langs{display:grid;grid-template-columns:repeat(4,1fr);gap:0 28px;padding-top:6px;border-top:1px solid var(--line);font-size:13.5px}
.mi2 .langs div{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.mi2 .langs span{color:var(--dim);font-variant-numeric:tabular-nums}
.dlg .mi2 .glance,.dlg .mi2 .vgrid{gap:16px 20px}
.dlg .mi2 .langs{grid-template-columns:repeat(3,1fr)}
.dlg .mi2{padding-top:14px}
.nfo{margin:14px 0 0;padding:16px;border-radius:12px;background:var(--bg);font:400 12.5px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre;overflow:auto;max-height:62vh;color:var(--ink)}
.pvimg{display:block;max-width:100%;max-height:70vh;margin:0 auto;border-radius:10px}
.pvbar{display:flex;align-items:center;gap:12px;min-height:32px;margin:12px 0 10px;color:var(--dim);font-size:13px;font-variant-numeric:tabular-nums}
.pvbar .btn{margin-left:auto;background:var(--line)}
.pvbar .btn[aria-pressed=true]{background:var(--acc);color:var(--accink)}
.pvwrap{display:block;width:100%;cursor:default}
.dlg.canfull .pvwrap{cursor:zoom-in}
.dlg.full{width:auto;max-width:calc(100vw - 60px);max-height:calc(100vh - 60px)}
.dlg.full .pvwrap{cursor:zoom-out;width:auto}
.dlg.full .pvimg{max-width:none;max-height:none}
.pvthumb{display:block;margin-bottom:18px;border-radius:12px;overflow:hidden;padding:0}
.pvthumb img{display:block;max-width:100%;max-height:260px}
.pvthumb:hover{filter:brightness(1.08)}
/* release details page */
.crumbs{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:22px;color:var(--dim);font-size:14px;font-weight:600}
.crumbs a:hover{color:var(--ink)}
.dhead{display:grid;grid-template-columns:190px 1fr;gap:28px;margin-top:16px;align-items:start}
.dhead .art{width:190px;aspect-ratio:2/3;border-radius:12px;overflow:hidden;background:var(--panel2);box-shadow:var(--shadow)}
.dhead .art img{width:100%;height:100%;object-fit:cover;display:block}
.dhead h1{font:800 30px/1.15 Manrope,sans-serif;letter-spacing:-.02em;text-wrap:balance}
.dhead h1 a:hover{color:var(--acc)}
.relname{margin-top:10px;font-weight:700;font-size:15.5px;overflow-wrap:anywhere}
.dhead .for{margin-top:8px;color:var(--dim)}
.dhead .for a{color:var(--ink);font-weight:700;border-bottom:1px solid var(--line)}
.dhead .for a:hover{color:var(--acc)}
.dacts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.dacts .btn{height:40px;padding:0 18px;border-radius:20px;font-size:14px}
.dcols{display:grid;grid-template-columns:1fr 360px;gap:34px;margin:26px 0 34px;align-items:start}
.dcols.noshow{grid-template-columns:1fr}
.dhead.noshow{grid-template-columns:1fr}
.dhead h1.relonly{font-size:24px;overflow-wrap:anywhere}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{padding:12px 16px;font-weight:600;font-size:14px;color:var(--dim);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--acc)}
.panel{padding:20px 0}
dl.vals{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px 24px;margin-top:6px}
dl.vals dt{font-size:12.5px;color:var(--dim);font-weight:600}
dl.vals dd{margin-top:3px;font-weight:500;font-variant-numeric:tabular-nums}
.epbox{display:grid;grid-template-columns:1fr;gap:4px;padding:16px 18px;border-radius:14px;background:var(--panel);border:1px solid var(--line);margin-bottom:22px}
.epbox b{font-size:16px;font-weight:600}
.epbox span{color:var(--dim);font-size:14px}
.aboutshow h2,.sibs h2{font:800 17px/1.2 Manrope,sans-serif}
.aboutshow h2{margin-top:12px}
.aboutshow .meta{margin-top:8px;color:var(--dim);font-size:14px}
.aboutshow .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.aboutshow .starring{font-size:13.5px}
.aboutshow .toshow{display:inline-block;margin-top:16px;font-weight:600;font-size:14px;border-bottom:1px solid var(--line)}
.aboutshow .toshow:hover{color:var(--acc);border-color:var(--acc)}
.sibs{margin:0 0 70px}
.sibs h2{margin-bottom:6px}
.sibs tr.me td{background:var(--panel)}
.sibs tr.me td:first-child{border-radius:10px 0 0 10px}
.sibs tr.me td:last-child{border-radius:0 10px 10px 0}
.sibs .this{color:var(--acc);font-size:12.5px;font-weight:600;margin-top:4px}
.filelist td{padding:7px 10px;font:500 12.5px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace}
/* releases feed */
.feed{margin-top:18px}
.feed td{padding:12px 12px;vertical-align:middle}
.feed td:first-child,.feed th.selall{padding-left:4px;padding-right:4px}
.rt .selcol{padding-left:4px;padding-right:4px}
.feed tbody td.num,.feed tbody td:nth-child(5){color:var(--dim)}
.feed tbody td:nth-child(6){color:var(--ink)}
.feed td.art{width:88px;padding-left:6px;padding-right:14px}
.feed tr:hover td.art a{transform:scale(1.04)}
.feed td.art a{display:block;width:88px;height:132px;border-radius:10px;border:1px solid var(--line);box-shadow:0 6px 14px -6px rgb(0 0 0/.55);transition:transform .25s cubic-bezier(.16,1,.3,1);overflow:hidden;background:var(--panel2)}
.feed td.art a{position:relative;overflow:hidden}
.feed td.art a::before{content:attr(data-t);position:absolute;inset:0;display:grid;place-items:center;padding:6px;text-align:center;font-size:11px;line-height:1.25;color:var(--dim)}
.feed td.art img{position:relative;width:100%;height:100%;object-fit:cover;display:block}
.feed td.art .np{font-size:10px;padding:4px}
.feed{table-layout:fixed;width:100%}
.feed td.what{overflow:hidden}
.feed td:nth-child(5){white-space:nowrap}
.feed td.what .rname,td.name .rname{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.showlink{display:inline-block;margin-top:6px;color:var(--dim);font-size:13.5px}
.showlink:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}

.feed td.what .epl{font-weight:500;color:var(--dim);font-size:13.5px}
.feed td.what code{display:block;margin-top:2px;font:500 12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--dim);overflow-wrap:anywhere}
.feed tr.dayrow td{padding:38px 0 12px;border-bottom:1px solid var(--line);font:800 19px/1 Manrope,sans-serif;letter-spacing:-.01em}
.feed tr.dayrow small{font:500 14px/1 Manrope,sans-serif;color:var(--dim);margin-left:10px}
.feed tr.moreof td{padding:0 10px 0 0}
.feed tr.moreof td div{display:flex;align-items:center;gap:14px;margin-left:120px;padding:14px 0 16px;border-left:1px solid var(--line);padding-left:20px}
.feed tr.moreof button{color:var(--dim);font-weight:500;font-size:13.5px;display:inline-flex;align-items:center;gap:8px}
.feed tr.moreof button:hover{color:var(--ink)}
.feed tbody tr:not(.dayrow):not(.moreof):hover{background:var(--panel)}

/* home */
.day{margin-top:30px}
.day h2{font:800 19px/1 Manrope,sans-serif;letter-spacing:-.01em;display:flex;align-items:baseline;gap:10px}
.day h2 small{font:500 14px/1 Manrope,sans-serif;color:var(--dim)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:24px 18px;margin-top:14px}
.tile{display:block}
.tile .art{position:relative;aspect-ratio:2/3;border-radius:12px;overflow:hidden;background:var(--panel2);transition:transform .3s cubic-bezier(.16,1,.3,1),box-shadow .3s}
.tile:hover .art{transform:translateY(-5px);box-shadow:var(--shadow)}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.np{display:grid;place-items:center;padding:14px;text-align:center;font-weight:800;font-size:15px;line-height:1.2;color:var(--dim);background:var(--panel2);width:100%;height:100%}
.tile .count{position:absolute;right:8px;top:8px;padding:3px 9px;border-radius:12px;background:rgb(10 10 14/.82);color:#fff;font-weight:500;font-size:12px}
.tile b{display:block;margin-top:10px;font-weight:700;font-size:15px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tile .what{margin-top:2px;font-size:13.5px;color:var(--dim)}
.facts{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.chip{display:inline-block;padding:1px 8px;border-radius:6px;border:1px solid var(--line);font-weight:500;font-size:12.5px;line-height:18px;white-space:nowrap}
.res{display:inline-block;width:72px;height:26px;line-height:26px;text-align:center;border-radius:7px;font-weight:500;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.res.r-4k{background:var(--r4k-bg);color:var(--r4k-fg)}
.res.r-1080{background:var(--r1080-bg);color:var(--r1080-fg)}
.res.r-720{background:var(--r720-bg);color:var(--r720-fg)}
.res.r-sd{background:var(--rsd-bg);color:var(--rsd-fg)}
.res.r-unk{width:72px;background:none;color:var(--dim);outline:1px dashed var(--line);outline-offset:-1px}


.chip.src{background:var(--panel2);border-color:transparent}
/* the details header's source chip sits in a flex row that stretches it: centre its label (reviewer fix 2026-09-27) */
.dhead .rchips .chip.src{display:inline-flex;align-items:center}
.tile .size{margin-top:6px;font-size:12.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.more{display:block;margin:34px auto 60px;height:46px;padding:0 26px;border-radius:23px;background:var(--panel2);font-weight:700}
.more:hover{background:var(--line)}
.empty{margin:60px 0;text-align:center;color:var(--dim)}

/* show page */
.back{display:inline-flex;align-items:center;gap:8px;margin-top:22px;color:var(--dim);font-weight:600;font-size:14px}
.back:hover{color:var(--ink)}
.showhead{display:grid;grid-template-columns:200px 1fr;gap:34px;margin-top:16px;align-items:start}
.showhead .art{width:200px;aspect-ratio:2/3;border-radius:14px;overflow:hidden;box-shadow:var(--shadow);background:var(--panel2)}
.showhead img{width:100%;height:100%;object-fit:cover;display:block}
.showhead h1{font:800 44px/1.04 Manrope,sans-serif;letter-spacing:-.03em;text-wrap:balance}
.showhead .meta{margin-top:10px;color:var(--dim)}
.showhead p{margin-top:14px;max-width:640px;line-height:1.6}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.bar2.hastabs{align-items:flex-end;padding:8px 0 0;gap:0 26px;flex-wrap:nowrap}
.stabs{display:flex;flex-wrap:nowrap;align-items:flex-end;gap:0 4px;margin:0 auto -1px 0;min-width:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.stabs a{padding:12px 16px;font-weight:600;font-size:15px;color:var(--dim);border-bottom:2px solid transparent;white-space:nowrap}
.stabs a:hover{color:var(--ink)}
.stabs a[aria-current]{color:var(--ink);border-bottom-color:var(--acc)}
.stabs .lbl{padding:12px 8px 12px 0;font-weight:600;font-size:15px;color:var(--dim);border-bottom:2px solid transparent}
.stabs.many{gap:0}
.stabs.many a{padding:12px 8px;min-width:30px;text-align:center;font-variant-numeric:tabular-nums}
.sfil{display:flex;gap:10px;padding-bottom:9px;flex:none}
.bar2{position:sticky;top:68px;z-index:10;background:var(--bg);display:flex;flex-wrap:wrap;align-items:center;gap:10px 26px;padding:14px 0;margin-top:26px;border-bottom:1px solid var(--line)}
.bar2 h2{font:800 21px/1 Manrope,sans-serif;letter-spacing:-.015em;margin-right:auto}
.ep{border-bottom:1px solid var(--line)}
.ep>button{display:grid;grid-template-columns:62px minmax(0,460px) 120px 1fr auto;gap:16px;align-items:center;width:100%;padding:14px 6px;text-align:left}
.ep>button:hover{background:var(--panel)}
.ep .no{font-weight:600;color:var(--dim);font-variant-numeric:tabular-nums}
.ep .ti{font-weight:600}
.ep .ti small{display:block;font-weight:500;font-size:13px;color:var(--dim)}
.ep .n{font-size:13.5px;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:left}
.relbtn{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 10px 0 14px;border-radius:17px;background:var(--panel2);color:var(--ink);font-weight:600;font-size:13.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.relbtn .i{transform:rotate(90deg);transition:transform .25s cubic-bezier(.16,1,.3,1);color:var(--dim)}
.ep>button:hover .relbtn{background:var(--line)}
.ep[open-] .relbtn,.ep[open-]>button:hover .relbtn{background:var(--acc);color:var(--accink)}
.ep[open-] .relbtn .i{transform:rotate(-90deg);color:var(--accink)}
.rels{padding:2px 6px 18px 76px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:600;font-size:12px;color:var(--dim);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th button{font-weight:600;display:inline-flex;align-items:center;gap:4px}
th button:hover{color:var(--ink)}
th button[aria-sort],th[aria-sort] button{color:var(--ink)}
td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
table.rt{table-layout:fixed;width:100%}
td.name{overflow:hidden}
td.nw{white-space:nowrap;min-width:96px}
td.name b{display:block;font:700 13.5px/1.3 Manrope,sans-serif;color:var(--ink);margin-bottom:2px}
td.num{text-align:right;white-space:nowrap} th.num{text-align:right}
.acts{display:flex;gap:6px;justify-content:flex-end;white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:16px;font-weight:600;font-size:13px;background:var(--acc);color:var(--accink)}
.btn:hover{filter:brightness(1.1)}
.btn.sec{background:var(--panel2);color:var(--ink)}
.btn.sec[aria-pressed=true]{background:var(--acc);color:var(--accink)}
.packs{margin:26px 0 70px}
.packs:has(+ .packs){margin-bottom:26px}
.packs h3{font:800 17px/1 Manrope,sans-serif;margin-bottom:6px}
.packs .rels{padding-left:0}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:24px;font-weight:700;font-size:14px;transition:all .3s cubic-bezier(.16,1,.3,1);pointer-events:none;z-index:50}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:900px){.wrap{padding:0 16px}.nav .wrap{gap:10px}.iconbtn .lbl{display:none}.iconbtn{padding:0 12px}.search{min-width:0}.fg{flex-wrap:wrap}.filters h1{flex-basis:100%}.bar2{position:static}.bar2 h2{flex-basis:100%}.ep .n{white-space:normal;text-align:right;font-size:12.5px}.nav a.l{display:none}.search{width:auto;flex:1}.showhead{grid-template-columns:110px 1fr;gap:16px}.showhead .art{width:110px}.showhead h1{font-size:28px}.rels{padding-left:0;overflow-x:auto}.tiles{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}.ep>button{grid-template-columns:40px 1fr auto 18px}.ep .fc{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---- Movies: the releases list's second filter row (seven menus, one fixed width each, never wraps) ---- */
.mrow{display:flex;flex-wrap:nowrap;align-items:center;gap:10px;padding:14px 0 0}
.mfilters{display:flex;flex-wrap:nowrap;align-items:center;gap:10px}
.mfilters .sfm .mbtn{width:clamp(128px,calc((min(100vw,1500px) - 80px - 134px)/7),183px)}
/* Audio + Language (2026-09-26): the release's menus, then the film's menus on a second row (he chose B) */
.mrow.two{padding-top:10px}
/* ---- filter look (2026-09-26): he chose C, grouped panels: each row a named panel of menus; the name regular, the value semibold ---- */
.mfilters .grp{display:block;flex:none;width:58px;font-size:12.5px;font-weight:600;color:var(--dim)}
.sfm .mbtn .v.any{font-weight:500}
.mfilters{padding:6px 6px 6px 18px;border-radius:26px;background:var(--panel2)}
.mfilters .sfm:not(.set) .mbtn{background:var(--panel)}
.mfilters .sfm:not(.set) .mbtn:hover{background:var(--line)}
.sfm .mbtn .k{font-weight:500;color:var(--dim)}
.sfm .mbtn .sep{color:var(--dim)}
.sfm .mbtn .v.any{color:var(--dim)}
.msel.set .mbtn .k,.msel.set .mbtn .sep{color:var(--accink)}
.mrow .clearall{flex:none;width:64px;text-align:left;color:var(--acc);font-weight:500;font-size:14px;white-space:nowrap}
.mrow .clearall:hover{text-decoration:underline;text-underline-offset:3px}
.mrow .clearall[aria-hidden=true]{visibility:hidden}
.filters .sel.sortsel{margin-left:0}
/* year: one choice (decade, range or single year), so round markers instead of boxes */
.mitem .dot{display:grid;place-items:center;width:18px;height:18px;border-radius:9px;border:1.5px solid var(--dim);flex:none}
.mitem[aria-checked=true] .dot{border-color:var(--acc)}
.mitem[aria-checked=true] .dot::after{content:"";width:8px;height:8px;border-radius:4px;background:var(--acc)}
.mhead{padding:10px 10px 4px;font-size:12px;font-weight:600;color:var(--dim)}
.msep{height:1px;margin:6px 4px;background:var(--line)}
.yrange{display:flex;align-items:center;gap:8px;padding:4px 10px 8px}
.yrange input{width:72px;height:34px;border-radius:17px;border:0;background:var(--panel2);text-align:center;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink);caret-color:var(--acc)}
.yrange input:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.yrange span{color:var(--dim);font-size:13px}
.yrange .btn{height:34px;margin-left:auto}
.yrange .btn[disabled]{opacity:.45;cursor:default;filter:none}
.mhead.yerr{color:var(--bad)}
.ymenu{width:290px}
.ymenu .years{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.ymenu .years .mitem{height:36px;gap:8px;padding:0 8px;font-variant-numeric:tabular-nums}
.mitem .sub2{margin-left:auto;color:var(--dim);font-size:12.5px;font-variant-numeric:tabular-nums}
/* no-poster placeholder in the releases list: a name card when the release name states Title.Year.quality, else the film tile (he chose B, 2026-09-26) */
.feed td.art a.ph{display:grid;place-items:center;align-content:center;gap:8px;background:var(--panel2);color:var(--dim);text-align:center}
.feed td.art a.ph::before{content:none}
.feed td.art a.ph svg{width:30px;height:30px;stroke-width:1.4;opacity:.8}
.feed td.art a.ph small{font-size:11px;line-height:1.2}
.feed td.art a.ph.card{padding:8px 4px;gap:4px}
.feed td.art a.ph.card b{font-size:11px;line-height:1.25;font-weight:500;color:var(--dim);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;justify-self:stretch;min-width:0}
.feed td.art a.ph.card small{font-variant-numeric:tabular-nums}
.feed td.art .np{font-weight:500}
/* placeholder for screens not designed yet */
.later{margin:80px auto;max-width:560px;text-align:center;color:var(--dim)}
.later h1{font:800 26px/1.2 Manrope,sans-serif;color:var(--ink);margin-bottom:10px}
.later a{color:var(--ink);font-weight:600;border-bottom:1px solid var(--line)}
.later a:hover{color:var(--acc);border-color:var(--acc)}

/* group + poster: one unit that never splits; the poster name shortens with an ellipsis to the room left (2026-09-26) */
.rchips .orig{display:inline-flex;gap:5px;min-width:0;max-width:100%}
.rchips .orig .rc{flex:none}
.rchips .orig .rc:last-child{flex:0 1 auto;min-width:0}
.rchips .orig .rc .ot{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rchips .orig{flex:1 1 0;min-width:190px}
.feed .rchips .orig{gap:8px}
/* releases list only: the four round actions as 2 × 2 (download + copy link on top, cart + watch below; cart alone when there is no watch) (2026-09-26) */
.iconacts.stack{display:grid;grid-template-columns:repeat(2,32px);gap:6px;justify-content:end}
.iconacts.stack .slot{display:none}
/* release-list buttons in colour (2026-09-26): coral stays on Download only; Copy link blue, Cart green, Watch violet.
   Tinted ground + coloured icon (he chose A). On (in cart / following) = solid fill of the button's own hue. */
:root{--b-cp:235;--b-ct:150;--b-w:300}
.iconacts.stack .ia[data-copynzb]{--h:var(--b-cp)}.iconacts.stack .ia[data-cart]{--h:var(--b-ct)}.iconacts.stack .ia[data-watch]{--h:var(--b-w)}
.iconacts.stack .ia:not(.dl){background:oklch(0.31 0.06 var(--h));color:oklch(0.86 0.11 var(--h))}
.iconacts.stack .ia:not(.dl):hover{background:oklch(0.37 0.08 var(--h))}
:root[data-theme=light] .iconacts.stack .ia:not(.dl){background:oklch(0.92 0.045 var(--h));color:oklch(0.45 0.14 var(--h))}
:root[data-theme=light] .iconacts.stack .ia:not(.dl):hover{background:oklch(0.87 0.07 var(--h))}
.iconacts.stack .ia:not(.dl)[aria-pressed=true]{background:oklch(0.72 0.15 var(--h));color:oklch(0.18 0.04 var(--h))}
.iconacts.stack .ia:not(.dl)[aria-pressed=true]:hover{background:oklch(0.78 0.13 var(--h))}
:root[data-theme=light] .iconacts.stack .ia:not(.dl)[aria-pressed=true]{background:oklch(0.50 0.15 var(--h));color:#fff}
:root[data-theme=light] .iconacts.stack .ia:not(.dl)[aria-pressed=true]:hover{background:oklch(0.44 0.15 var(--h))}
.iconacts.stack .ia:not(.dl):focus-visible{outline-color:var(--ink);outline-offset:1px}
/* ---- Film page (2026-09-27): the TV show page's header, then ONE release table (not grouped) under a two-cell filter bar,
   then Similar films. Buttons in the table are the releases list's tinted hues on one line; a pressed Cart / Watch fills in
   its own hue, never coral (his rule). ---- */
.fhead .meta{display:flex;flex-wrap:wrap;align-items:center;gap:0 7px;font-variant-numeric:tabular-nums}
.fhead .meta .res{margin-left:3px}
.fhead .starring+.starring{margin-top:2px}
.fhead .dacts{margin-top:20px}
.fhead .ph{display:grid;place-items:center;align-content:center;gap:8px;width:100%;height:100%;padding:22px 16px;background:var(--panel2);color:var(--dim);text-align:center}
.fhead .ph .t{font-weight:500;font-size:17px;line-height:1.3;overflow-wrap:anywhere}
.fhead .ph small{font-size:14px;font-variant-numeric:tabular-nums}
.btn.ext .i{width:14px;height:14px;opacity:.75}
.btn.wat{--h:var(--b-w);background:oklch(0.31 0.06 var(--h));color:oklch(0.86 0.11 var(--h))}
.btn.wat:hover{filter:none;background:oklch(0.37 0.08 var(--h))}
:root[data-theme=light] .btn.wat{background:oklch(0.92 0.045 var(--h));color:oklch(0.45 0.14 var(--h))}
:root[data-theme=light] .btn.wat:hover{background:oklch(0.87 0.07 var(--h))}
.btn.wat[aria-pressed=true]{background:oklch(0.72 0.15 var(--h));color:oklch(0.18 0.04 var(--h))}
.btn.wat[aria-pressed=true]:hover{background:oklch(0.78 0.13 var(--h))}
:root[data-theme=light] .btn.wat[aria-pressed=true]{background:oklch(0.50 0.15 var(--h));color:#fff}
:root[data-theme=light] .btn.wat[aria-pressed=true]:hover{background:oklch(0.44 0.15 var(--h))}
/* the two labels share one cell so the button keeps the wider one's width: nothing moves when it is pressed */
.btn.wat .wl{display:grid}.btn.wat .wl>span{grid-area:1/1}.btn.wat .wl>span[hidden]{display:block;visibility:hidden}
.btn.wat:focus-visible{outline-color:var(--ink);outline-offset:1px}
.frel{margin-top:40px;scroll-margin-top:84px}
.frel>h2,.simf>h2{font:800 21px/1.1 Manrope,sans-serif;letter-spacing:-.015em}
.frel .mrow{padding-top:14px}
/* two cells, each as wide as a cell of the Movie releases list's bars */
.fbar.pf .fseg.rel{flex:0 0 calc(((100% - 12px) / 2 - 8px) * 2 / 5 + 8px)}
.frel .pager.slim{margin-top:10px}
.frel table.rt{margin-top:6px}
.frel .rt .selcol{width:34px}
.simf{margin:44px 0 80px}
/* six tiles as wide as the Films wall's tiles at the same window width (seven to a row there) */
.simf .tiles{grid-template-columns:repeat(6,calc((100% - 108px) / 7));margin-top:14px}
/* ---- Release details (2026-09-27): the approved TV details page adapted. Header buttons (his pick B): Download coral, Copy link and
   Cart neutral, Follow film violet as on the film page; a pressed Cart fills green, a pressed Follow violet, never coral (his rule). ---- */
.mdet .dhead .art .ph{display:grid;place-items:center;align-content:center;gap:8px;width:100%;height:100%;padding:20px 14px;background:var(--panel2);color:var(--dim);text-align:center}
.mdet .dhead .art .ph .t{font-weight:500;font-size:16px;line-height:1.3;overflow-wrap:anywhere}
.mdet .dhead .art .ph small{font-size:13px;font-variant-numeric:tabular-nums}
/* Copy link and Cart neutral at rest; a pressed Cart fills green (hue 150), never coral */
.btn.sec.nt.ct[aria-pressed=true]{background:oklch(0.72 0.15 var(--b-ct));color:oklch(0.18 0.04 var(--b-ct))}
.btn.sec.nt.ct[aria-pressed=true]:hover{filter:none;background:oklch(0.78 0.13 var(--b-ct))}
:root[data-theme=light] .btn.sec.nt.ct[aria-pressed=true]{background:oklch(0.50 0.15 var(--b-ct));color:#fff}
:root[data-theme=light] .btn.sec.nt.ct[aria-pressed=true]:hover{background:oklch(0.44 0.15 var(--b-ct))}
.btn.sec.nt .wl{display:grid}.btn.sec.nt .wl>span{grid-area:1/1}.btn.sec.nt .wl>span[hidden]{display:block;visibility:hidden}
.btn.sec.nt:focus-visible{outline-color:var(--ink);outline-offset:1px}
/* a shorter label (In cart, Follow film) keeps its gap to the icon inside the reserved width (details and film page) */
.dacts .btn .wl{text-align:start}
.mdet .epbox .tagl{font-size:16px;font-weight:600}
.mdet .epbox .plot{color:var(--dim);font-size:14px;line-height:1.55}
.predb{margin-top:30px}
.predb h3{font:800 15px/1.2 Manrope,sans-serif;margin-bottom:6px}
.predb .wide{grid-column:1/-1}.predb dd{overflow-wrap:anywhere}
.aboutshow .starring+.starring{margin-top:2px}
.aboutshow .tags+.starring{margin-top:14px}
.mdet .sibs{margin:0 0 44px;scroll-margin-top:84px}
.mdet .sibs .pager.slim{margin-top:6px}
.mdet .sibs table.rt{margin-top:6px}
.mdet .sibs h2{margin-bottom:6px}
.mdet .simrel{margin-bottom:80px}
/* the Movie releases list's film line (.showlink), on its own line under the name */
.rt .showlink{display:block;width:fit-content}
.loadnote{margin:80px 0;text-align:center;color:var(--dim)}
/* ---- Films wall (2026-09-26): the TV wall's tile; lines "Year · Genre, Genre", "Score · Certificate", and the release count as a grey line (he chose A) ---- */
.wall .tiles{margin-top:4px}
.tile .what,.tile .m2,.tile .m3{font-variant-numeric:tabular-nums}
.tile .m3{margin-top:2px;font-size:12.5px;color:var(--dim)}
.tile .art .ph{display:grid;place-items:center;align-content:center;gap:8px;width:100%;height:100%;padding:18px 14px;background:var(--panel2);color:var(--dim);text-align:center}
.tile .art .ph .t{font-weight:500;font-size:15px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.tile .art .ph small{font-size:13px;font-variant-numeric:tabular-nums}
.wall .tile .gn{white-space:nowrap}
/* the top pager's arrows never move as the page count changes */
.wall .pager.slim .pg{min-width:calc(13ch + 20px);text-align:center}
.mrow .person{flex:none}

/* ---- filter bar (2026-09-26, on trial against the grouped-panels fallback): the release's filters and the film's filters each one
   continuous bar of cells (name above value, hairline dividers), like a booking site's search bar; the open cell lifts out of the bar;
   a set filter is marked by a coral line under its value; long lists search and scroll inside their own menu ---- */
.varsel{position:fixed;left:24px;bottom:24px;z-index:35;display:flex;align-items:center;gap:10px;padding:6px 6px 6px 16px;border-radius:24px;background:var(--panel);box-shadow:var(--shadow);font-size:13px;color:var(--dim)}
.mrow.fbar{gap:12px}
.fbar{--raise:#2a2e39}
:root[data-theme=light] .fbar{--raise:#fff}
.fbar .fseg{display:flex;align-items:stretch;height:56px;padding:4px;border-radius:18px;background:var(--panel2);min-width:0}
.fbar .fseg.rel{flex:5 1 0}
.fbar .fseg.film{flex:5 1 0}
.fbar.one .fseg.film{flex:0 0 calc((100% - 12px) / 2)}
.pager.slim.fixed .pg{min-width:calc(13ch + 20px);text-align:center}
.pager.slim .clearall{width:64px;margin-right:12px;text-align:right;color:var(--acc);font-weight:500;font-size:14px;white-space:nowrap}
.pager.slim .clearall:hover{text-decoration:underline;text-underline-offset:3px}
.pager.slim .clearall[aria-hidden=true]{visibility:hidden}
.fbar .sfm{position:relative;display:flex;flex:1 1 0;min-width:0}
.fbar .sfm .mbtn{position:relative;width:100%;height:48px;padding:0 10px 0 14px;border-radius:14px;background:transparent;color:var(--ink);justify-content:space-between;gap:6px}
.fbar .sfm .mbtn:hover{background:var(--line)}
.fbar .sfm.open .mbtn{background:var(--raise);box-shadow:var(--shadow)}
.fbar .sfm .mmenu{background:var(--raise)}
.fbar .msearch{background:var(--raise)}
.fbar .sfm .mbtn .lab{display:flex;flex-direction:column;gap:2px;line-height:1.2}
.fbar .sfm .mbtn .sep{display:none}
.fbar .sfm .mbtn .k{font-size:11.5px;font-weight:500;color:#fff}
:root[data-theme=light] .fbar .sfm .mbtn .k{color:var(--ink)}
.fbar .sfm .mbtn .v{font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fbar .sfm .mbtn .v.any{font-weight:500;color:var(--dim)}
.fbar .sfm .mbtn svg{color:var(--dim)}
.fbar .sfm+.sfm::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:1px;background:var(--line);pointer-events:none}
.fbar .sfm:hover::before,.fbar .sfm:hover+.sfm::before,.fbar .sfm.open::before,.fbar .sfm.open+.sfm::before{opacity:0}
/* set: the cell keeps the bar's ground; a coral line under the value says it is on */
.fbar .msel.set .mbtn{background:transparent;color:var(--ink)}
.fbar .msel.set .mbtn:hover{background:var(--line)}
.fbar .msel.set.open .mbtn{background:var(--raise)}
.fbar .msel.set .mbtn .k{color:#fff}
:root[data-theme=light] .fbar .msel.set .mbtn .k{color:var(--ink)}
.fbar .msel.set .mbtn .v{color:var(--ink)}
.fbar .msel.set .mbtn::after{content:"";position:absolute;left:14px;right:14px;bottom:3px;height:3px;border-radius:2px;background:var(--acc)}
.fbar .sfm .mmenu{top:58px;left:0;right:auto;min-width:max(100%,230px)}
.fbar .sfm .mmenu.searchable{max-height:402px}
.fbar .mrow .clearall,.mrow.fbar .clearall{align-self:center}
/* long lists: a search field that stays at the top of the menu, the options scroll under it */
.mmenu.searchable{padding-top:0}
.msearch{position:sticky;top:0;z-index:1;display:flex;align-items:center;margin:0 -6px 4px;padding:10px 12px 8px;background:var(--panel);color:var(--dim)}
.msearch svg{position:absolute;left:24px;top:50%;transform:translateY(-35%);pointer-events:none}
.msearch input{flex:1;min-width:0;height:34px;padding:0 12px 0 34px;border:0;border-radius:17px;background:var(--panel2);color:var(--ink);font:500 13.5px Manrope,sans-serif;caret-color:var(--acc)}
.msearch input::placeholder{color:var(--dim)}
.msearch input:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.mitem[hidden]{display:none}
/* the year menu in the bar: decades in three columns so the range shows without scrolling */
.fbar .yrange .btn[disabled]{opacity:1;background:var(--panel2);color:var(--dim)}
.fbar .ymenu>[role=menu]:first-child{display:grid;grid-template-columns:repeat(3,1fr);column-gap:2px}
.fbar .ymenu>[role=menu]:first-child>.mitem:first-child,.fbar .ymenu>[role=menu]:first-child>.mhead{grid-column:1/-1}
.fbar .ymenu>[role=menu]:first-child>.mitem{gap:8px;padding:0 6px}

/* ---- Follow button icon (2026-09-27): a bookmark, filled solid while followed ---- */
[data-watch][aria-pressed=true] svg.i.fill{fill:currentColor}

/* ---- Adult (2026-09-29): the Movie releases list without the film's filters. Adult releases have no title, so no Follow,
   no batch expander, no title page. The picture is the release's own preview (16:9 frame) or sample, not a 2:3 poster. ---- */
/* four cells (no Source, his call 2026-09-29), each as wide as a cell of the Movie releases list's bar */
.fbar.one .fseg.rel{flex:0 0 calc(((100% - 12px) / 2 - 8px) * 4 / 5 + 8px)}
/* the name search: the TV / Movies search field's size and place; it narrows the list instead of opening a result box */
.nsearch label{position:relative}
.nsearch .clr{display:grid;place-items:center;width:24px;height:24px;margin-right:-8px;border-radius:12px;color:var(--dim)}
.nsearch .clr:hover{background:var(--line);color:var(--ink)}
.nsearch .clr[hidden]{display:grid;visibility:hidden}
/* picture: the whole 16:9 frame in a wider first column (his pick A 2026-09-29; the 88 x 132 poster slot cropped too much) */
/* no Source column: Size is now the 5th cell and Posted the 6th; keep Movies' look (Size in ink, Posted dim) */
.feed tbody td:nth-child(5){color:var(--ink)}
.feed tbody td:nth-child(6){color:var(--dim)}
.feed td:nth-child(6){white-space:nowrap}
.feed td.art.wide{width:196px}
.feed td.art.wide a{width:176px;height:99px}
.feed td.art a.nopic{display:grid;place-items:center;align-content:center;gap:6px;background:var(--panel2);color:var(--dim);text-align:center}
.feed td.art a.nopic::before{content:none}
.feed td.art a.nopic svg{width:26px;height:26px;stroke-width:1.4;opacity:.8}
.feed td.art a.nopic small{font-size:11px;line-height:1.2}
/* "No picture" tile: no fill, no shadow, a dashed outline like the Unknown resolution chip (his pick B 2026-09-29 over the
   raised grey Movies tile: 55% of the section has no picture, so the empty boxes must not outweigh the real ones) */
.feed td.art a.nopic{background:transparent;box-shadow:none;border-style:dashed}
/* Clip chip: magenta 305 (his pick 2026-09-29 of three built: teal-green 172 looked like Preview, orange 45 like a warning).
   Dark fill chroma 0.085 so it reads magenta beside violet Media info; light fill pale, the lettering carries the hue (reviewer) */
:root{--k-cl-bg:oklch(0.31 0.085 305);--k-cl-fg:oklch(0.87 0.09 305)}
:root[data-theme=light]{--k-cl-bg:oklch(0.93 0.03 305);--k-cl-fg:oklch(0.40 0.17 305)}
.rc.k-cl{background:var(--k-cl-bg);color:var(--k-cl-fg)}
/* group + poster: the unit wraps to its own line before the poster name is cut below 96 px (the wider picture column leaves less room) */
/* the Category menu's separator under "Exclude Other": --line matches the raised menu ground in dark, so mix from ink */
.fbar .sfm .msep{background:color-mix(in oklab,var(--ink) 16%,transparent)}
.rchips .orig{min-width:min-content}
.rchips .orig .rc:last-child{min-width:96px}
.clipv{display:block;width:100%;max-height:66vh;border-radius:10px;background:#000}
/* details: the release's pictures and clip at the top of Overview, side by side */
.adpics{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:22px}
.adpics .pvthumb{margin:0;position:relative}
.adpics .pvthumb img{max-height:220px}
.adpics .pvthumb .lbl{position:absolute;left:8px;bottom:8px;padding:2px 9px;border-radius:7px;background:rgb(10 10 14/.8);color:#fff;font-weight:600;font-size:12px}
/* a preview that plays a clip (his call 2026-09-29: the picture must say so): a play button in the middle and the Clip
   chip's magenta tag, "Clip · 30 s", in the other bottom corner; the button fills magenta on hover */
/* the tag sits on the picture, not the page, so it keeps the dark chip values in both themes */
.adpics .pvthumb .lbl.cl{left:auto;right:8px;background:oklch(0.31 0.085 305);color:oklch(0.87 0.09 305)}
.adpics .pvthumb .play{position:absolute;left:50%;top:50%;display:grid;place-items:center;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:28px;background:rgb(10 10 14/.72);color:#fff;box-shadow:0 6px 18px -6px rgb(0 0 0/.6);transition:background .2s,transform .25s cubic-bezier(.16,1,.3,1)}
.adpics .pvthumb .play svg{width:24px;height:24px;margin-left:3px;fill:currentColor}
.adpics .pvthumb.hasclip:hover .play,.adpics .pvthumb.hasclip:focus-visible .play{background:oklch(0.55 0.17 305);transform:scale(1.06)}

</style>

<script>
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const ic=n=>`<svg class="i" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const RES=['4K','1080p','720p','SD'], SRC=['WEB','Blu-ray','DVD','HDTV'];
// today's adult sub-categories in the site's order (CategoriesTableSeeder + the VR / OnlyFans migrations)
// VR kept, OnlyFans dropped (his call 2026-09-29)
const CAT_ORDER=['DVD','WMV','XviD','x264','HD Clips','SD Clips','UHD','VR','Packs','Imageset','SD','WEBDL','Other'];
const state={rsort:'posted_desc',page:1,per:50,sel:new Set(),res:new Set(),src:new Set(),cat:new Set(),aud:new Set(),comp:false,q:'',dd:null,cart:new Set(),tab:'overview',
  msq:{},drel:null,ssort:{k:'posted',dir:-1}};
const NOCACHE='?t='+Date.now();
const store={get(k,d){try{return localStorage.getItem('nntmux.adult.'+k)||d;}catch(e){return d;}},set(k,v){try{localStorage.setItem('nntmux.adult.'+k,v);}catch(e){}}};
let REL,BYID={},NOW,NOWALL,RX={x:{},summ:{},aud:{}},MEDIA=null,FILES=null,NFO=null,PREDB=null,SIM=null,PV=new Set(),CLIPS=new Set(),CATS=[],AUDS=[];

const resChip=v=>`<span class="res r-${{'4K':'4k','1080p':'1080','720p':'720','SD':'sd'}[v]||'unk'}">${v}</span>`;
const srcLabel=r=>r.remux?'Remux':r.src;
const gb=b=>b>=1073741824?(b/1073741824).toFixed(b>=10737418240?1:2)+' GB':b>=1048576?Math.round(b/1048576)+' MB':Math.max(1,Math.round(b/1024))+' KB';
const shortDate=t=>new Date(t*1000).toLocaleDateString('en-US',{day:'numeric',month:'short',year:'numeric'});
const fullDate=t=>new Date(t*1000).toLocaleString('en-US',{dateStyle:'medium',timeStyle:'short'});

   &&(!state.comp||r.comp>=+state.comp)&&(!state.aud.size||audOf(r).some(a=>state.aud.has(a)))&&(!q||r.name.toLowerCase().includes(q));}
// a release's audio languages (media info); none known reads Unknown, as Resolution and Source do

const OPTS=()=>({cat:CATS.map(v=>[v,v]),res:[...RES,'Unknown'].map(v=>[v,v]),src:[...SRC,'Unknown'].map(v=>[v,v]),aud:AUDS.map(v=>[v,v])});

const EXO=()=>CATS.filter(c=>c!=='Other');

function menu(k){const [label,anyLabel]=LABELS[k],opts=OPTS()[k],set=state[k],on=opts.filter(([v])=>set.has(v)),open=state.dd===k,search=opts.length>10;if(!open)delete state.msq[k];
  const exo=k==='cat'&&isExo();

  return `<div class="msel sfm${on.length?' set':''}${open?' open':''}" data-msel="${k}"><button class="mbtn" data-ddtoggle="${k}" aria-haspopup="true" aria-expanded="${open}" title="${exo?'Category: Exclude Other':on.length?esc(label+': '+on.map(o=>o[1]).join(', ')):''}">${lab(label,txt,!on.length)}${ic('chev')}</button>
  ${open?(search?`<div class="mmenu searchable" role="dialog" aria-label="${label}"><div class="msearch">${ic('search')}<input data-msearch="${k}" placeholder="Search ${SEARCH_NAME[k]||label.toLowerCase()}" aria-label="Search ${SEARCH_NAME[k]||label.toLowerCase()}" value="${esc(state.msq[k]||'')}" autocomplete="off"></div><div role="menu" aria-label="${label}">${items}</div></div>`
    :`<div class="mmenu" role="menu" aria-label="${label}">${items}</div>`):''}</div>`;}

const niceCodec=c=>({'V_MPEG4/ISO/AVC':'H.264','AVC':'H.264','V_MPEGH/ISO/HEVC':'H.265','HEVC':'H.265','V_AV1':'AV1','AV1':'AV1','V_MPEG2':'MPEG-2','MPEG Video':'MPEG-2','V_MPEG4/ISO/ASP':'MPEG-4','MPEG-4 Visual':'MPEG-4','XVID':'XviD','xvid':'XviD','WMV3':'WMV','VC-1':'VC-1'}[c]||c);

function miSummary(r){const sm=RX.summ[r.id];if(!sm)return null;return sm.split(' · ').map((x,i)=>{if(i===0)return niceCodec(x);const m=x.match(/^(.*?)\s+(\d+)$/);return m?m[1]+' '+niceCh(m[2]):x;}).join(' · ');}
// chip order (TV SPEC 4): completion, Password, media info, NFO, Preview, Sample, Clip

   +(x.pw?`<span class="rc">${ic('lock')}Password</span>`:'')
   +(mi!=null&&mi!==''?`<button class="rc k-mi" data-mi="${r.id}" title="View media info">${ic('info')}${esc(mi)}</button>`:'')

  return `<span class="orig">`+(x.group?link('k-grp','/browse/all?group='+encodeURIComponent(x.group),'All releases in '+x.group,'users',x.group.replace('alt.binaries.','a.b.')):'')

const pageHref=(base,n)=>/^#\/release\//.test(base)?base+'/p/'+n:n===1?base:(base==='#/'?'#/p/':base+'/p/')+n;
function pager(page,pages,total,bottom,base='#/',unit='release',per=state.per){const href=n=>pageHref(base,n);
  if(!bottom){const from=total?(page-1)*per+1:0,to=Math.min(page*per,total);
    return `<nav class="pager slim" aria-label="Pages, top"><span class="sum">${total?`Showing ${from.toLocaleString()}–${to.toLocaleString()} of ${total.toLocaleString()} ${unit}${total===1?'':'s'}`:`Showing 0 ${unit}s`}</span>${page>1?`<a href="${href(page-1)}" rel="prev" aria-label="Previous page">${ic('back')}</a>`:`<button class="off" disabled aria-label="Previous page">${ic('back')}</button>`}<span class="pg">Page ${page.toLocaleString()} of ${pages.toLocaleString()}</span>${page<pages?`<a href="${href(page+1)}" rel="next" aria-label="Next page">${ic('open')}</a>`:`<button class="off" disabled aria-label="Next page">${ic('open')}</button>`}</nav>`;}
  if(pages<=1)return '<div class="list-end" aria-hidden="true"></div>';
  const nums=new Set([1,2,pages-1,pages,page-2,page-1,page,page+1,page+2].filter(n=>n>=1&&n<=pages));
  let out='',prev=0;[...nums].sort((a,b)=>a-b).forEach(n=>{if(n-prev>1)out+='<span class="gap">…</span>';out+=n===page?`<span class="cur" aria-current="page">${n}</span>`:`<a href="${href(n)}" aria-label="Page ${n}">${n}</a>`;prev=n;});
  return `<nav class="pager bottom" aria-label="Pages, bottom">${page>1?`<a href="${href(page-1)}" rel="prev">${ic('back')}&nbsp;Previous</a>`:`<button class="off" disabled>Previous</button>`}${out}${page<pages?`<a href="${href(page+1)}" rel="next">Next&nbsp;${ic('open')}</a>`:`<button class="off" disabled>Next</button>`}
   <form data-goto data-pages="${pages}" data-base="${base}"><label for="gob">Go to page</label><input id="gob" inputmode="numeric" aria-label="Go to page"></form></nav>`;}

function copyText(t){window.__copied=t;if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(t).then(()=>true,()=>legacyCopy(t));return Promise.resolve(legacyCopy(t));}
function legacyCopy(t){const a=document.createElement('textarea');a.value=t;a.setAttribute('readonly','');a.style.cssText='position:fixed;top:0;left:0;opacity:0';document.body.appendChild(a);a.select();let ok=false;try{ok=document.execCommand('copy');}catch(e){}a.remove();return ok;}
const ago=t=>{const m=Math.max(1,Math.round((NOWALL-t)/60));return m<60?m+' min ago':m<1440?Math.round(m/60)+' hr ago':shortDate(t);};

<script>

    else if(d.img){e.preventDefault();const r=BYID[d.img];openDialog(d.kind==='sample'?'Sample image':'Preview image',r,imgHtml(r,d.kind));setupImg(u.dataset.fullnow!==undefined);if(pa){const chip=u.closest('tr')?.querySelector(`.rchips [data-img="${d.img}"][data-kind="${d.kind}"]`);if(chip)lastFocus=chip;}}
    else if(d.clip){const r=BYID[d.clip];openDialog('Video clip',r,clipHtml(r));}
    else if(d.mi){const r=BYID[d.mi];needMedia().then(()=>openDialog('Media information',r,mediaHtml(r)));}
    else if(d.files){const r=BYID[d.files];needFiles().then(()=>openDialog('Files',r,filesHtml(r)));}
    else if(d.bulk){const ids=[...state.sel];if(d.bulk==='cart'){ids.forEach(i=>state.cart.add(i));$('#cartn').textContent=state.cart.size;toast(ids.length+' added to the cart');}else if(d.bulk==='nzb')toast('Would download '+ids.length+' NZBs as one zip');state.sel.clear();rerender();}
    return;}
  const t=e.target.closest('[data-nzb],[data-cart],[data-dummy]');if(!t)return;
  if(t.dataset.dummy!==undefined){e.preventDefault();toast('Only the Adult section is part of this prototype');return;}
  if(t.dataset.nzb){const r=BYID[t.dataset.nzb];toast('Would download the NZB: '+gb(r.size)+' '+r.res);}
  else if(t.dataset.cart){const id=+t.dataset.cart;state.cart.has(id)?state.cart.delete(id):state.cart.add(id);$('#cartn').textContent=state.cart.size;rerender();$(`[data-cart="${id}"]`)?.focus({preventScroll:true});}
});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.selectall!==undefined){const ids=$$('.feed [data-select]').map(c=>+c.dataset.select);ids.forEach(i=>t.checked?state.sel.add(i):state.sel.delete(i));rerender();$('[data-selectall]')?.focus();return;}
  if(t.dataset.select){const id=+t.dataset.select;t.checked?state.sel.add(id):state.sel.delete(id);rerender();$(`[data-select="${id}"]`)?.focus({preventScroll:true});return;}
  if(t.dataset.rsort!==undefined){state.rsort=t.value;store.set('rsort',t.value);firstPage();$('[data-rsort]')?.focus();}});
// the name search narrows the list as you type (today's 180 ms pause, release-browser-component.js), back to page 1; focus and caret stay in the field
let qTimer=null;
document.addEventListener('input',e=>{const ms=e.target.dataset?.msearch;if(ms){state.msq[ms]=e.target.value;const q=e.target.value.trim().toLowerCase();$$(`[data-msel="${ms}"] [data-ddpick]`).forEach(b=>{b.hidden=!!q&&!b.textContent.toLowerCase().includes(q);});return;}
  if(e.target.id==='q'){const v=e.target.value;clearTimeout(qTimer);qTimer=setTimeout(()=>{state.q=v;afterFilter();const c=$('#q')?.selectionStart;rerender();const q=$('#q');if(q){q.focus({preventScroll:true});q.setSelectionRange(c,c);}},180);}});
document.addEventListener('submit',e=>{
  const f=e.target.closest('[data-goto]');if(f){e.preventDefault();const n=Math.min(+f.dataset.pages,Math.max(1,parseInt(f.querySelector('input').value,10)||0));if(!n)return;location.hash=pageHref(f.dataset.base||'#/',n);return;}
  if(e.target.closest('.sitesearch')){e.preventDefault();toast('The site-wide release search stays as it is; only the Adult section is in this prototype');}});
$('#cartbtn').addEventListener('click',()=>toast(state.cart.size?state.cart.size+' release'+(state.cart.size===1?'':'s')+' in the cart':'The cart is empty'));
$('#theme').addEventListener('click',()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'light':'dark';});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&e.target.id==='q'&&state.q){state.q='';e.target.value='';afterFilter();rerender();$('#q')?.focus();return;}
  if(e.key==='Escape'&&$('#modal').innerHTML){closeDialog();return;}if(e.key==='Escape'&&state.dd){const k=state.dd;state.dd=null;rerender();$(`[data-ddtoggle="${k}"]`)?.focus();return;}});
document.addEventListener('focusout',e=>{const m=e.target.closest?.('.msel');if(!m||!state.dd||!e.relatedTarget||m.contains(e.relatedTarget))return;state.dd=null;m.querySelector('.mmenu')?.remove();m.querySelector('[data-ddtoggle]')?.setAttribute('aria-expanded','false');});

Promise.all(['ad/data.json','ad/relx.json','ad/previews.json','ad/clips.json'].map(u=>fetch(u+NOCACHE).then(r=>r.json()))).then(([d,rx,pv,cl])=>{RX=rx;PV=new Set(pv);CLIPS=new Set(cl);
  REL=d.rel.map(a=>({id:a[0],name:a[1],size:a[2],t:a[3],comp:a[4],grabs:a[5],res:a[6],src:a[7],remux:!!a[8]}));
  REL.forEach(r=>{BYID[r.id]=r;});
  CLIPCOUNT=REL.filter(r=>X(r).clip).length;
  {const have=new Set(REL.map(catOf));CATS=CAT_ORDER.filter(c=>have.has(c));}
  // Audio: English first, then A to Z, then Unknown (#868)
  {const s=new Set(REL.flatMap(r=>RX.aud[r.id]||[]).filter(l=>l!=='Unknown'));AUDS=[...(s.has('English')?['English']:[]),...[...s].filter(l=>l!=='English').sort((a,b)=>a.localeCompare(b)),'Unknown'];}
  loadFilters();
  NOW=Math.max(...REL.map(r=>r.t));NOWALL=Math.max(NOW,...REL.map(r=>X(r).added));
  {const r=store.get('rsort','posted_desc');if(['posted_desc','posted_asc','added_desc','added_asc'].includes(r))state.rsort=r;}
  lastHash=location.hash;route();window.READY=true;});
</script>
