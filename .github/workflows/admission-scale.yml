{
  "name": "Performance acceptance (manual)",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "suite": {
          "description": "Explicit acceptance suite at the selected workflow revision",
          "required": true,
          "type": "choice",
          "options": [
            "admission-scale",
            "frontier-scale",
            "tv-memory",
            "admission-comparison",
            "ingestion-scale",
            "recovery-index-scale",
            "naming-scale"
          ]
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "acceptance-${{ github.ref }}-${{ inputs.suite }}",
    "cancel-in-progress": false
  },
  "jobs": {
    "acceptance": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 125,
      "env": {
        "COMPOSER_AUTH": "{\"github-oauth\":{\"github.com\":\"${{ secrets.GITHUB_TOKEN }}\"}}"
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
        },
        {
          "uses": "./.github/actions/ci-sail"
        },
        {
          "env": {
            "SUITE": "${{ inputs.suite }}"
          },
          "run": "python3 scripts/ci-run --acceptance \"$SUITE\""
        },
        {
          "name": "Stop Sail",
          "if": "always()",
          "run": "./sail down"
        }
      ]
    }
  }
}
