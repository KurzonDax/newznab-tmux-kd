name: Admission scale and comparison
on:
  workflow_dispatch:
  schedule:
    - cron: '47 4 * * *'
permissions:
  contents: read
concurrency:
  group: admission-scale-${{ github.ref }}
  cancel-in-progress: false
jobs:
  admission-scale:
    name: Full admission scale and historical comparison
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/ci-sail
      - name: Start disposable MariaDB
        run: ./sail up -d --wait mariadb
      - name: Compare identical synthetic caller fixtures
        run: ./sail exec -T -u sail -e CBP_INTEGRATION_DB_DATABASE=cbp_integration laravel.test scripts/benchmark-admission
      - name: Verify complete large backlogs and million-row discovery
        run: ./sail exec -T -u sail -e CBP_INTEGRATION_DB_DATABASE=cbp_integration laravel.test scripts/run-tests-isolated.sh php artisan test --compact --fail-on-skipped --fail-on-warning --fail-on-empty-test-suite tests/Integration/AdmissionThroughputMariaDbTest.php --group admission-scale
      - name: Stop Sail
        if: always()
        run: ./sail down
