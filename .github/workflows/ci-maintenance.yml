name: CI maintenance
on:
  push:
    branches: [master]
    paths:
      - 'docker/8.5/**'
      - '.github/docker-compose.ci*.yml'
      - '.github/php-ci.ini'
      - '.github/actions/ci-sail/**'
      - '.github/workflows/ci-maintenance.yml'
      - '.github/workflows/laravel.yml'
      - 'composer.json'
      - 'composer.lock'
      - 'package.json'
      - 'package-lock.json'
      - 'sail'
      - 'Makefile'
      - '.env.test'
      - 'scripts/ci-*'
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-cache-maintenance-master
  cancel-in-progress: false
jobs:
  maintenance:
    name: Trusted runtime maintenance and serial validation
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/ci-sail
        id: setup
        with:
          npm-cache: 'true'
          export-build-cache: 'true'
          fresh: ${{ github.event_name != 'push' }}
      - name: Warm npm downloads on input changes
        if: github.event_name == 'push'
        run: ./sail exec -T -u sail laravel.test bash -c 'umask 0022; exec npm ci --no-audit --no-fund'
      - name: Run tests
        if: github.event_name != 'push'
        run: ./sail exec -T -u sail laravel.test scripts/run-tests-isolated.sh scripts/ci-phpunit-shard --index 0 --count 1

      - name: Run bounded correctness from the shared inventory
        if: github.event_name != 'push'
        run: python3 scripts/ci-run --all-correctness

      - name: Audit dependencies (informational)
        if: github.event_name != 'push'
        continue-on-error: true
        run: make deps-audit
      - name: Save Composer downloads
        if: success() && steps.setup.outputs.composer-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/nntmux-ci-cache/composer/files
          key: ${{ steps.setup.outputs.composer-key }}
      - name: Save npm downloads
        if: success() && steps.setup.outputs.npm-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/nntmux-ci-cache/npm/_cacache
          key: ${{ steps.setup.outputs.npm-key }}
      - name: Stop Sail
        if: always()
        run: ./sail down
