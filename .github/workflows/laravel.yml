{
  "name": "Run tests",
  "on": {
    "pull_request": null
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "${{ github.workflow }}-${{ github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "scope": {
      "name": "CI preflight",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 2,
      "outputs": {
        "php": "${{ steps.plan.outputs.php }}",
        "specialist": "${{ steps.plan.outputs.specialist }}",
        "plan": "${{ steps.plan.outputs.plan }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "fetch-depth": 0
          }
        },
        {
          "id": "plan",
          "env": {
            "BASE_SHA": "${{ github.event.pull_request.base.sha }}"
          },
          "run": "python3 scripts/ci-preflight --base \"$BASE_SHA\" --github"
        }
      ]
    },
    "php": {
      "name": "PHP shard ${{ matrix.shard }}",
      "needs": "scope",
      "if": "needs.scope.outputs.php == 'true'",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "strategy": {
        "fail-fast": false,
        "max-parallel": 4,
        "matrix": {
          "shard": [
            0,
            1,
            2,
            3
          ]
        }
      },
      "env": {
        "COMPOSER_AUTH": "{\"github-oauth\":{\"github.com\":\"${{ secrets.GITHUB_TOKEN }}\"}}"
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
        },
        {
          "uses": "./.github/actions/ci-sail"
        },
        {
          "env": {
            "SHARD_INDEX": "${{ matrix.shard }}"
          },
          "run": "./sail exec -T -u sail laravel.test timeout --kill-after=5 480 scripts/run-tests-isolated.sh scripts/ci-phpunit-shard --index \"$SHARD_INDEX\" --count 4"
        },
        {
          "name": "Stop Sail",
          "if": "always()",
          "run": "./sail down"
        }
      ]
    },
    "specialist": {
      "name": "Selected checks ${{ matrix.lane }}",
      "needs": "scope",
      "if": "needs.scope.outputs.specialist == 'true'",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 17,
      "strategy": {
        "fail-fast": false,
        "max-parallel": 2,
        "matrix": {
          "lane": [
            0,
            1
          ]
        }
      },
      "env": {
        "COMPOSER_AUTH": "{\"github-oauth\":{\"github.com\":\"${{ secrets.GITHUB_TOKEN }}\"}}"
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
        },
        {
          "uses": "./.github/actions/ci-sail",
          "with": {
            "npm-cache": "true"
          },
          "id": "runtime",
          "if": "toJSON(fromJSON(needs.scope.outputs.plan).lanes[matrix.lane]) != '[]'"
        },
        {
          "env": {
            "CI_PLAN": "${{ needs.scope.outputs.plan }}",
            "LANE": "${{ matrix.lane }}"
          },
          "run": "python3 scripts/ci-run --plan \"$CI_PLAN\" --lane \"$LANE\""
        },
        {
          "name": "Stop Sail",
          "if": "always() && steps.runtime.outcome != 'skipped'",
          "run": "./sail down"
        }
      ]
    },
    "required": {
      "name": "PHP 8.5 via Sail",
      "needs": [
        "scope",
        "php",
        "specialist"
      ],
      "if": "${{ always() }}",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 2,
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
        },
        {
          "env": {
            "NEEDS_JSON": "${{ toJSON(needs) }}"
          },
          "run": "python3 scripts/ci-policy result \"$NEEDS_JSON\""
        }
      ]
    }
  }
}
